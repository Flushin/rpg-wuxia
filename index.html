<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RPG Wuxia</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#10141c;color:#eee;font:14px/1.3 system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud>*{pointer-events:auto}
.frame{position:absolute;background:rgba(10,12,20,.72);border:1px solid #556;border-radius:8px;padding:6px 8px}
.line{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;font-size:13px}
.bar{position:relative;height:14px;background:#222;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;inset:0 auto 0 0;width:100%}
.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px;text-shadow:0 0 3px #000}
.hp i{background:#c0392b}.mp i{background:#2e86de}.xp i{background:#d4a017}.xp{height:10px}.xp span{line-height:10px;font-size:9px}
#player-frame{top:8px;left:8px;width:170px}
#target-frame{top:8px;left:50%;transform:translateX(-50%);width:230px;border-color:#a55;pointer-events:none}
#boss-bar{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 400px));min-width:230px;background:rgba(40,8,8,.8);border:1px solid #d44;border-radius:8px;padding:6px 10px;pointer-events:none;text-align:center;z-index:1}
#boss-bar b{font-size:15px;color:#ffb0a0;letter-spacing:1px}#boss-bar .bar{height:22px;margin-top:4px;border:1px solid #733}#boss-bar .bar span{line-height:22px;font-size:12px}
#top-right{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#map-name{background:rgba(10,12,20,.72);border:1px solid #556;border-radius:8px;padding:5px 10px;font-weight:600}
button{font:inherit;color:#eee;background:#2a3042;border:1px solid #667;border-radius:8px;padding:8px 12px;cursor:pointer}
button:active{background:#3b4360}
button.primary{background:#8a3b2a;border-color:#c66}
#btn-attrs{position:relative}
#pts-badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#d4a017;color:#000;font-weight:700;font-size:12px;line-height:20px;text-align:center}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:10px 18px;border-radius:10px;font-size:18px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#joystick{position:absolute;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}
#btn-attack{position:absolute;right:24px;bottom:30px;width:96px;height:96px;border-radius:50%;background:rgba(160,50,40,.75);border:2px solid #f99;font-size:16px;font-weight:700;touch-action:none}
#attrs-panel,#create{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:12px;overflow:auto}
.card{background:#1a1f2e;border:1px solid #667;border-radius:12px;padding:16px;width:min(420px,100%);max-height:100%;overflow:auto}
.card h2{margin:0 0 8px;font-size:18px}.card h3{margin:14px 0 4px;font-size:14px;color:#cba}
table{width:100%;border-collapse:collapse}td,th{padding:4px 2px;text-align:left}th{font-weight:400;color:#99a;font-size:12px}
td small{display:block;color:#889;font-size:11px}.num{text-align:right;font-weight:600;width:60px}
table.two td{padding:2px}
td button{padding:2px 12px;font-size:16px;background:#2d6a3a}
td.plus{width:64px;text-align:right}td.plus button{min-width:52px;min-height:44px;font-size:22px}
tr.rec td{background:rgba(212,160,23,.1)}tr.rec td:first-child{border-left:3px solid #d4a017;padding-left:6px}
td small.why{color:#cb9;font-style:italic}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;vertical-align:middle}
.badge.rec{background:#d4a017;color:#000}.badge.opt{background:#2a3042;color:#aab;border:1px solid #556;font-weight:400}
button[disabled]{opacity:.45;cursor:default}
#attrs-panel .card{max-height:100%;-webkit-overflow-scrolling:touch}
#attrs-panel,#settings-panel{touch-action:pan-y}
#settings-panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:12px;overflow:auto}
#settings-panel .card{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.opt{display:flex;align-items:center;gap:10px;margin:0;font-size:16px}.opt input{width:22px;height:22px}
.muted{color:#889}
.sld{display:grid;grid-template-columns:70px 1fr 32px;align-items:center;gap:8px;margin:0;font-size:16px}.sld input{width:100%;height:36px;touch-action:none;margin:0;padding:0}.sld output{text-align:right;color:#aab;font-size:14px}
#btn-settings{padding:6px 10px;font-size:18px;line-height:1}
#tip-card{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);width:min(380px,calc(100% - 24px));background:rgba(20,26,40,.95);border:1px solid #d4a017;border-radius:10px;padding:10px 12px}
#tip-card b{color:#d4a017}#tip-card p{margin:4px 0 8px;font-size:13px}#tip-card button{width:100%;padding:8px}
@media (pointer:coarse){#tip-card{top:176px;bottom:auto}}
.pts b{color:#d4a017;font-size:16px}
.card .primary{width:100%;margin-top:14px}
#create{background:radial-gradient(circle at 50% 30%,#2a3350,#0c0f18);z-index:10}
#create .card{width:min(560px,100%);position:relative}
#lang-slot{position:absolute;top:8px;right:8px}
.opt .lang-sw{margin-left:auto}
.lang-sw{display:flex;gap:4px;align-items:center}.lang-sw button,.lang-sw button.primary{padding:4px 9px;font-size:12px;line-height:1.2;min-height:0;height:auto;width:auto;margin:0}
#create h1{margin:0 0 4px;font-size:26px;text-align:center;letter-spacing:2px}
#create p.sub{margin:0 0 14px;text-align:center;color:#99a}
label{display:block;margin-bottom:6px;color:#ccd}
#char-name{width:100%;padding:10px;border-radius:8px;border:1px solid #667;background:#10141c;color:#fff;font:inherit;font-size:16px;margin-bottom:12px;user-select:text;-webkit-user-select:text}
#char-name.err{border-color:#e55}
#class-cards{display:flex;gap:10px;flex-wrap:wrap}
.class-card{flex:1 1 220px;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid #445;border-left:6px solid var(--c)}
.class-card.sel{border-color:var(--c);background:#2f3550}
.class-card b{font-size:16px}.class-card span{font-size:12px;color:#fc9}.class-card em{font-size:12px;color:#bbc;font-style:normal}.class-card small{font-size:11px;color:#889}
#btn-start,button.wide{width:100%;margin-top:10px;padding:12px;min-height:44px}
#del-name{width:100%;padding:10px;border-radius:8px;border:1px solid #667;background:#10141c;color:#fff;font:inherit;font-size:16px;margin-bottom:6px;user-select:text;-webkit-user-select:text}
button.danger{background:#8a2a2a;border-color:#f66}
.slot-card{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid #445;border-left:6px solid var(--c,#445);border-radius:10px;padding:10px;margin-bottom:8px;background:#222a3e}
.slot-card.empty{border-style:dashed;background:transparent;color:#99a}
.slot-info{flex:1 1 180px;min-width:0}.slot-info b{font-size:16px}.slot-info small{display:block;color:#aab;font-size:12px;margin-top:2px}
.slot-btns{display:flex;gap:6px;flex:0 0 auto}.slot-btns button{min-height:44px;min-width:78px}
.slot-card.last{box-shadow:0 0 0 1px #d4a017}
@media (max-width:480px){.slot-btns{width:100%}.slot-btns button{flex:1}}
#create{align-items:flex-start}#create .card{margin:auto}
#toast{white-space:pre-line}
#hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px}
.slot{position:relative;width:56px;height:56px;padding:0;border-radius:10px;border:2px solid #778;background:#1a1f2e;overflow:hidden;touch-action:none;color:#fff}
.slot .ic{position:absolute;inset:4px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;text-shadow:0 1px 3px #000;background:var(--c)}
.slot .key{position:absolute;left:4px;top:2px;font-size:11px;font-weight:700;text-shadow:0 0 3px #000;z-index:2}
.slot .sweep{position:absolute;inset:0;z-index:1}
.slot .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;text-shadow:0 0 4px #000;z-index:2}
.slot .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;line-height:1.1;z-index:2;background:rgba(0,0,0,.6)}
.slot.nomana .ic{filter:saturate(.2) brightness(.55)}
.slot.nomana{border-color:#46c}
.slot.locked .ic{filter:grayscale(1) brightness(.4)}
.slot.ready{border-color:#d4a017}
#hotbar.touch{position:absolute;left:auto;right:0;bottom:0;transform:none;width:0;height:0;display:block}
#hotbar.touch .slot{position:absolute;width:56px;height:56px;border-radius:50%}
#hotbar.touch .slot .ic{border-radius:50%}
#hotbar.touch .slot .key{display:none}
#skill-tip{position:fixed;z-index:20;width:240px;background:rgba(14,18,30,.96);border:1px solid #d4a017;border-radius:10px;padding:8px 10px;pointer-events:none;font-size:12px}
#hotbar{z-index:1}
#attrs-panel,#skills-panel,#inv-panel,#npc-panel,#settings-panel,#auto-panel{z-index:5}
#offline-panel{z-index:8}
#skill-tip b{font-size:14px;color:#fc9}#skill-tip p{margin:4px 0}#skill-tip .st{color:#9bd}
.sk-bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-top:3px}.sk-bar i{display:block;height:100%;background:#4a8fd0}
#skills-panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:12px;overflow:auto;touch-action:pan-y}
#skills-panel .card{width:min(460px,100%)}
.sk-row{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid #334}.sk-row .ic{flex:none;width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--c);text-shadow:0 1px 3px #000}
.sk-row.locked{opacity:.55}.sk-row.locked .ic{filter:grayscale(1)}
.sk-row small{display:block;color:#99a;font-size:12px}.sk-row .d{font-size:13px;margin:2px 0}
.sk-row .passive{background:#6a4a9a;color:#fff}
#btn-bag,#dur-warn{min-height:44px}
#dur-warn{background:#7a1f1f;border-color:#f66;font-weight:700;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#a52a2a}}
#potion-bar{position:absolute;left:14px;bottom:14px;display:flex;gap:8px}
#potion-bar.touch{left:20px;bottom:160px}
.pot{position:relative;width:52px;height:52px;padding:0;border-radius:10px;border:2px solid #778;background:#1a1f2e;overflow:hidden;touch-action:none;color:#fff}
.pot.hp{--c:#c0392b}.pot.mp{--c:#2e86de}
.pot .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c);opacity:.6}
.pot .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--c);text-shadow:0 0 3px #000,0 0 3px #000;filter:brightness(1.6)}
.pot .cnt{position:absolute;right:4px;bottom:2px;font-size:12px;font-weight:700;text-shadow:0 0 3px #000}
.pot .hk{position:absolute;left:4px;top:1px;font-size:11px;font-weight:700;text-shadow:0 0 3px #000}
.pot .rem{position:absolute;left:0;right:0;top:2px;text-align:center;font-size:10px;text-shadow:0 0 3px #000}
.pot.empty{opacity:.45}.pot.active{border-color:var(--c)}
#inv-panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:12px;overflow:auto;touch-action:pan-y}
.inv-card{width:min(440px,100%);display:block;position:relative;-webkit-overflow-scrolling:touch}
.inv-card h2{display:flex;justify-content:space-between;align-items:baseline}
.gold{color:#ffd23f;font-weight:700;font-size:14px}
.eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;justify-items:center}
.eqs{display:flex;flex-direction:column;align-items:center}.eqs small{color:#99a;font-size:11px}
.bag-grid{display:grid;grid-template-columns:repeat(5,48px);gap:4px;justify-content:center}
.cell{position:relative;width:48px;height:48px;min-height:48px;padding:0;border-radius:8px;border:2px solid #445;background:#10141c;overflow:hidden;touch-action:manipulation}
.cell.sel{outline:2px solid #d4a017;outline-offset:1px}
.cell .ic{position:absolute;inset:3px 3px 8px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px #000;background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 55%,#000),color-mix(in srgb,var(--rc) 25%,#000))}
.cell .qty{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:11px;font-weight:700;text-shadow:0 0 3px #000}
.cell .dur{position:absolute;left:3px;right:3px;bottom:2px;height:4px;background:#222;border-radius:2px;overflow:hidden}
.cell .dur u,.dbar u{display:block;height:100%;background:#4cd964}
.cell .dur.low u,.dbar.low u{background:#f1a02e}.cell .dur.zero u,.dbar.zero u{background:#e04848}
.inv-detail{margin-top:12px;font-size:13px;position:sticky;bottom:-16px;background:#1a1f2e;border-top:1px solid #445;padding:8px 0;max-height:46vh;overflow:auto}
.inv-detail .tipbody>div{margin:1px 0}.inv-detail small{color:#99a}.tip-sell{color:#ffd23f}.tip-cmp{margin-top:6px;border-top:1px dashed #445;padding-top:4px}
.inv-detail .primary{margin-top:8px;min-height:44px}
.close-btn{width:100%;margin-top:12px;min-height:44px}
.win-x{position:sticky;top:0;z-index:3;display:block;width:40px;min-width:40px;height:40px;min-height:40px;padding:0;margin:-6px -6px -40px auto;font-size:18px;line-height:1;touch-action:manipulation}
.parts{display:block;font-size:10px;font-weight:400;color:#889;white-space:nowrap}
.win-x+h2{padding-right:44px}
.sort-btn{min-height:32px;padding:2px 10px;font-size:12px;float:right}
.cell .ic.empty{background:none;opacity:.25;font-size:22px;font-weight:400;text-shadow:none}
.cell .ic.sym{font-size:22px;font-weight:400;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;text-shadow:none}
@media (min-width:600px){.inv-card{width:min(720px,100%);display:grid;grid-template-columns:1fr 250px;gap:16px}.inv-detail{margin:0;position:sticky;top:0;bottom:auto;align-self:start;border-top:0;border-left:1px solid #445;padding:0 0 0 14px;max-height:none}}
#item-tip{position:fixed;z-index:30;width:230px;background:rgba(14,18,30,.97);border:1px solid #d4a017;border-radius:10px;padding:8px 10px;pointer-events:none;font-size:12px}
#item-tip>div{margin:1px 0}#item-tip small{color:#99a}
#npc-panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;pointer-events:none!important}
#npc-panel .card{pointer-events:auto;width:min(380px,100%);max-height:calc(100% - 24px);border-color:#d4a017}
@media (pointer:coarse){#npc-panel .card{width:min(320px,100%)}}
.npc-head{display:flex;justify-content:space-between;align-items:center}.npc-head h2{margin:0}
.npc-head .x{min-width:44px;min-height:44px;padding:0;font-size:18px}
.srow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #334}
.srow .si{flex:1;min-width:0}.srow .si small{display:block;color:#99a;font-size:11px}
.srow button{min-width:64px;min-height:44px;padding:4px 8px}
.srow button.danger{background:#8a2a2a;border-color:#f66}
.dbar{height:6px;background:#222;border-radius:3px;overflow:hidden;margin:3px 0}
.tabs,.qty{display:flex;gap:6px;align-items:center;margin:8px 0}.tabs button{flex:1;min-height:44px}
.qty button{min-width:44px;min-height:44px}
.tabs button.on,.qty button.on{background:#8a3b2a;border-color:#c66}
.lore{font-style:italic;color:#cdb;line-height:1.5}
#npc-panel .card .primary{min-height:44px}
#auto-row{display:flex;gap:6px}
#btn-auto,#btn-auto-cfg{min-height:44px}
#btn-auto{min-width:96px;font-weight:700}#btn-auto-cfg{min-width:44px;padding:0;font-size:20px}
#btn-auto.on{background:#2d6a3a;border-color:#6c6;box-shadow:0 0 8px rgba(90,220,110,.55)}
#btn-auto.paused{background:#8a6a1f;border-color:#e8b84a}
#auto-panel,#offline-panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:12px;overflow:auto;touch-action:pan-y}
#auto-panel .card,#offline-panel .card{width:min(440px,100%);-webkit-overflow-scrolling:touch}
#auto-panel .opt{min-height:44px}#auto-panel .opt input{flex:none}
#auto-panel .sld{grid-template-columns:118px 1fr 36px}
#auto-panel h3{margin:12px 0 2px}
#auto-panel .how{font-size:12px;color:#aab;line-height:1.45;background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px;margin-top:10px}
#auto-panel .how b{color:#d4a017}
.rep-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #334}.rep-row b{text-align:right}
#offline-panel .card{border-color:#d4a017}#offline-panel .primary{min-height:44px}
@media (max-height:520px){#top-right{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;align-items:center;max-width:min(600px,72%)}}
@media (max-width:420px){#joystick{width:110px;height:110px;left:14px;bottom:14px}#potion-bar.touch{bottom:136px;left:14px}}
@media (max-width:340px){#joystick{width:96px;height:96px}#potion-bar.touch{bottom:122px}}
@media (max-width:640px){
 #player-frame{width:150px}
 #target-frame{top:78px;width:200px}
 #boss-bar{top:8px;left:164px;transform:none;width:calc(100% - 330px);min-width:150px;padding:4px 6px}#boss-bar b{font-size:12px}#boss-bar .bar{height:16px}#boss-bar .bar span{line-height:16px;font-size:10px}
 #map-name{font-size:12px;padding:4px 8px}
 #hud .frame .line{font-size:12px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud" class="hidden">
  <div id="player-frame" class="frame">
    <div class="line"><b id="p-name"></b><span id="p-level"></span></div>
    <div class="bar hp"><i id="p-hp"></i><span id="p-hp-t"></span></div>
    <div class="bar mp"><i id="p-mp"></i><span id="p-mp-t"></span></div>
    <div class="bar xp"><i id="p-xp"></i><span id="p-xp-t"></span></div>
  </div>
  <div id="target-frame" class="frame hidden">
    <div class="line"><b id="t-name"></b><span id="t-level"></span></div>
    <div class="bar hp"><i id="t-hp"></i><span id="t-hp-t"></span></div>
  </div>
  <div id="boss-bar" class="hidden"><b id="boss-name"></b><div class="bar hp"><i id="boss-hp"></i><span id="boss-hp-t"></span></div></div>
  <div id="top-right">
    <div id="map-name"></div>
    <div id="auto-row"><button id="btn-auto">Auto (Z)</button><button id="btn-auto-cfg" aria-label="Menu do auto-combate">&#9776;</button></div>
    <button id="btn-settings" aria-label="Configurações">&#9881;</button>
    <button id="btn-skills">Skills (K)</button>
    <button id="btn-attrs">Atributos (C)<span id="pts-badge" class="hidden"></span></button>
    <button id="btn-bag">Mochila (I)</button>
    <button id="dur-warn" class="hidden" aria-label="Equipamento com pouca durabilidade">&#9888; Reparar</button>
  </div>
  <div id="toast"></div>
  <div id="hotbar"></div>
  <div id="skill-tip" class="hidden"></div>
  <div id="potion-bar">
    <button id="pot-hp" class="pot hp" aria-label="Poção de vida"><i class="fill"></i><span class="lb">HP</span><span class="hk"></span><span class="rem"></span><span class="cnt">0</span></button>
    <button id="pot-mp" class="pot mp" aria-label="Poção de mana"><i class="fill"></i><span class="lb">MP</span><span class="hk"></span><span class="rem"></span><span class="cnt">0</span></button>
  </div>
  <div id="joystick" class="hidden"><div id="knob"></div></div>
  <button id="btn-attack" class="hidden">Atacar</button>
  <div id="tip-card" class="hidden"><b id="tip-title"></b><p id="tip-text"></p><button id="tip-ok">Entendi</button></div>
  <div id="attrs-panel" class="hidden"></div>
  <div id="skills-panel" class="hidden"></div>
  <div id="inv-panel" class="hidden"></div>
  <div id="npc-panel" class="hidden"></div>
  <div id="item-tip" class="hidden"></div>
  <div id="settings-panel" class="hidden"></div>
  <div id="auto-panel" class="hidden"></div>
  <div id="offline-panel" class="hidden"></div>
</div>
<div id="create" class="hidden">
  <div class="card">
    <div id="lang-slot"></div>
    <h1>RPG WUXIA</h1>
    <div id="slots-view">
      <p class="sub" id="sub-slots">Escolha seu personagem</p>
      <div id="slot-list"></div>
    </div>
    <div id="create-view" class="hidden">
      <p class="sub" id="sub-create">Criar personagem</p>
      <label for="char-name" id="lbl-name">Nome</label>
      <input id="char-name" maxlength="16" placeholder="Seu nome" autocomplete="off" />
      <label id="lbl-sect">Seita</label>
      <div id="class-cards"></div>
      <button id="btn-start" class="primary">Começar jornada</button>
      <button id="btn-back" class="wide">Voltar</button>
    </div>
    <div id="del-view" class="hidden">
      <p class="sub" id="del-msg"></p>
      <input id="del-name" maxlength="16" placeholder="Digite o nome do personagem" autocomplete="off" />
      <button id="btn-del-ok" class="danger wide" disabled>Apagar personagem</button>
      <button id="btn-del-cancel" class="wide">Cancelar</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
