<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RPG Wuxia</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#10141c;color:#eee;font:14px/1.3 system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud>*{pointer-events:auto}
.frame{position:absolute;background:rgba(10,12,20,.72);border:1px solid #556;border-radius:8px;padding:6px 8px}
.line{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;font-size:13px}
.bar{position:relative;height:14px;background:#222;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;inset:0 auto 0 0;width:100%}
.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px;text-shadow:0 0 3px #000}
.hp i{background:#c0392b}.mp i{background:#2e86de}.xp i{background:#d4a017}.xp{height:10px}.xp span{line-height:10px;font-size:9px}
#player-frame{top:8px;left:8px;width:170px}
#target-frame{top:8px;left:50%;transform:translateX(-50%);width:230px;border-color:#a55;pointer-events:none}
#top-right{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#map-name{background:rgba(10,12,20,.72);border:1px solid #556;border-radius:8px;padding:5px 10px;font-weight:600}
button{font:inherit;color:#eee;background:#2a3042;border:1px solid #667;border-radius:8px;padding:8px 12px;cursor:pointer}
button:active{background:#3b4360}
button.primary{background:#8a3b2a;border-color:#c66}
#btn-attrs{position:relative}
#pts-badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#d4a017;color:#000;font-weight:700;font-size:12px;line-height:20px;text-align:center}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:10px 18px;border-radius:10px;font-size:18px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#joystick{position:absolute;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}
#btn-attack{position:absolute;right:24px;bottom:30px;width:96px;height:96px;border-radius:50%;background:rgba(160,50,40,.75);border:2px solid #f99;font-size:16px;font-weight:700;touch-action:none}
#attrs-panel,#create{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:12px;overflow:auto}
.card{background:#1a1f2e;border:1px solid #667;border-radius:12px;padding:16px;width:min(420px,100%);max-height:100%;overflow:auto}
.card h2{margin:0 0 8px;font-size:18px}.card h3{margin:14px 0 4px;font-size:14px;color:#cba}
table{width:100%;border-collapse:collapse}td,th{padding:4px 2px;text-align:left}th{font-weight:400;color:#99a;font-size:12px}
td small{display:block;color:#889;font-size:11px}.num{text-align:right;font-weight:600;width:60px}
table.two td{padding:2px}
td button{padding:2px 12px;font-size:16px;background:#2d6a3a}
td.plus{width:64px;text-align:right}td.plus button{min-width:52px;min-height:44px;font-size:22px}
tr.rec td{background:rgba(212,160,23,.1)}tr.rec td:first-child{border-left:3px solid #d4a017;padding-left:6px}
td small.why{color:#cb9;font-style:italic}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;vertical-align:middle}
.badge.rec{background:#d4a017;color:#000}.badge.opt{background:#2a3042;color:#aab;border:1px solid #556;font-weight:400}
button[disabled]{opacity:.45;cursor:default}
#attrs-panel .card{max-height:100%;-webkit-overflow-scrolling:touch}
#attrs-panel,#settings-panel{touch-action:pan-y}
#settings-panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:12px;overflow:auto}
#settings-panel .card{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.opt{display:flex;align-items:center;gap:10px;margin:0;font-size:16px}.opt input{width:22px;height:22px}
.muted{color:#889}
#btn-settings{padding:6px 10px;font-size:18px;line-height:1}
#tip-card{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);width:min(380px,calc(100% - 24px));background:rgba(20,26,40,.95);border:1px solid #d4a017;border-radius:10px;padding:10px 12px}
#tip-card b{color:#d4a017}#tip-card p{margin:4px 0 8px;font-size:13px}#tip-card button{width:100%;padding:8px}
.pts b{color:#d4a017;font-size:16px}
.card .primary{width:100%;margin-top:14px}
#create{background:radial-gradient(circle at 50% 30%,#2a3350,#0c0f18);z-index:10}
#create .card{width:min(560px,100%)}
#create h1{margin:0 0 4px;font-size:26px;text-align:center;letter-spacing:2px}
#create p.sub{margin:0 0 14px;text-align:center;color:#99a}
label{display:block;margin-bottom:6px;color:#ccd}
#char-name{width:100%;padding:10px;border-radius:8px;border:1px solid #667;background:#10141c;color:#fff;font:inherit;font-size:16px;margin-bottom:12px;user-select:text;-webkit-user-select:text}
#char-name.err{border-color:#e55}
#class-cards{display:flex;gap:10px;flex-wrap:wrap}
.class-card{flex:1 1 220px;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid #445;border-left:6px solid var(--c)}
.class-card.sel{border-color:var(--c);background:#2f3550}
.class-card b{font-size:16px}.class-card span{font-size:12px;color:#fc9}.class-card em{font-size:12px;color:#bbc;font-style:normal}.class-card small{font-size:11px;color:#889}
#btn-start,#btn-continue{width:100%;margin-top:12px;padding:12px}
@media (max-width:640px){
 #player-frame{width:150px}
 #target-frame{top:78px;width:200px}
 #map-name{font-size:12px;padding:4px 8px}
 #hud .frame .line{font-size:12px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud" class="hidden">
  <div id="player-frame" class="frame">
    <div class="line"><b id="p-name"></b><span id="p-level"></span></div>
    <div class="bar hp"><i id="p-hp"></i><span id="p-hp-t"></span></div>
    <div class="bar mp"><i id="p-mp"></i><span id="p-mp-t"></span></div>
    <div class="bar xp"><i id="p-xp"></i><span id="p-xp-t"></span></div>
  </div>
  <div id="target-frame" class="frame hidden">
    <div class="line"><b id="t-name"></b><span id="t-level"></span></div>
    <div class="bar hp"><i id="t-hp"></i><span id="t-hp-t"></span></div>
  </div>
  <div id="top-right">
    <div id="map-name"></div>
    <button id="btn-settings" aria-label="Configurações">&#9881;</button>
    <button id="btn-attrs">Atributos (C)<span id="pts-badge" class="hidden"></span></button>
  </div>
  <div id="toast"></div>
  <div id="joystick" class="hidden"><div id="knob"></div></div>
  <button id="btn-attack" class="hidden">Atacar</button>
  <div id="tip-card" class="hidden"><b id="tip-title"></b><p id="tip-text"></p><button id="tip-ok">Entendi</button></div>
  <div id="attrs-panel" class="hidden"></div>
  <div id="settings-panel" class="hidden"></div>
</div>
<div id="create" class="hidden">
  <div class="card">
    <h1>RPG WUXIA</h1>
    <p class="sub">Crie seu personagem</p>
    <button id="btn-continue" class="hidden"></button>
    <label for="char-name">Nome</label>
    <input id="char-name" maxlength="16" placeholder="Seu nome" autocomplete="off" />
    <label>Seita</label>
    <div id="class-cards"></div>
    <button id="btn-start" class="primary">Começar jornada</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
