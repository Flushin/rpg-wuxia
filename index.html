<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Wanderers</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#10141c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wanderers" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141c;
        color: #eee;
        font:
          14px/1.3 system-ui,
          sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }
      .hidden {
        display: none !important;
      }
      /* Tamanho da interface (⚙): o HUD é desenhado numa tela virtual 1/--ui menor e ampliado (src/ui/uiScale.ts) */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        width: calc(100% / var(--ui, 1));
        height: calc(100% / var(--ui, 1));
        transform: scale(var(--ui, 1));
        transform-origin: 0 0;
        pointer-events: none;
        padding: calc(env(safe-area-inset-top) / var(--ui, 1)) calc(env(safe-area-inset-right) / var(--ui, 1))
          calc(env(safe-area-inset-bottom) / var(--ui, 1)) calc(env(safe-area-inset-left) / var(--ui, 1));
      }
      button,
      label,
      .slot,
      .pot,
      .cell {
        touch-action: manipulation;
      }
      #zoom-note {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 60;
        transform-origin: 0 0;
        padding: 10px 14px;
        background: #8a3b2a;
        color: #fff;
        font-weight: 700;
        text-align: center;
        pointer-events: none;
      }
      .ui-size-row {
        flex-direction: column;
        align-items: stretch !important;
        gap: 6px;
      }
      .ui-size {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        width: 100%;
      }
      .ui-size button {
        flex: none;
        width: auto;
        margin: 0;
        padding: 6px 4px;
        min-height: 36px;
        height: 100%;
      }
      #hud > * {
        pointer-events: auto;
      }
      .frame {
        position: absolute;
        background: rgba(10, 12, 20, 0.72);
        border: 1px solid #556;
        border-radius: 8px;
        padding: 6px 8px;
      }
      .line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 3px;
        font-size: 13px;
      }
      .bar {
        position: relative;
        height: 14px;
        background: #222;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 3px;
      }
      .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 100%;
      }
      .bar span {
        position: absolute;
        inset: 0;
        text-align: center;
        font-size: 10px;
        line-height: 14px;
        text-shadow: 0 0 3px #000;
      }
      .hp i {
        background: #c0392b;
      }
      .mp i {
        background: #2e86de;
      }
      .xp i {
        background: #d4a017;
      }
      .xp {
        height: 10px;
      }
      .xp span {
        line-height: 10px;
        font-size: 9px;
      }
      #player-frame {
        top: 8px;
        left: 8px;
        width: 170px;
      }
      #target-frame {
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 230px;
        border-color: #a55;
        pointer-events: none;
      }
      #boss-bar {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, calc(100% - 400px));
        min-width: 230px;
        background: rgba(40, 8, 8, 0.8);
        border: 1px solid #d44;
        border-radius: 8px;
        padding: 6px 10px;
        pointer-events: none;
        text-align: center;
        z-index: 1;
      }
      #boss-bar b {
        font-size: 15px;
        color: #ffb0a0;
        letter-spacing: 1px;
      }
      #boss-bar .bar {
        height: 22px;
        margin-top: 4px;
        border: 1px solid #733;
      }
      #boss-bar .bar span {
        line-height: 22px;
        font-size: 12px;
      }
      #top-right {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      #map-name {
        background: rgba(10, 12, 20, 0.72);
        border: 1px solid #556;
        border-radius: 8px;
        padding: 5px 10px;
        font-weight: 600;
      }
      button {
        font: inherit;
        color: #eee;
        background: #2a3042;
        border: 1px solid #667;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:active {
        background: #3b4360;
      }
      button.primary {
        background: #8a3b2a;
        border-color: #c66;
      }
      #btn-attrs {
        position: relative;
      }
      #pts-badge {
        position: absolute;
        top: -7px;
        right: -7px;
        min-width: 20px;
        height: 20px;
        border-radius: 10px;
        background: #d4a017;
        color: #000;
        font-weight: 700;
        font-size: 12px;
        line-height: 20px;
        text-align: center;
      }
      #toast {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
      }
      /* Recompensas no HUD: ouro com "+N" que some, barra de XP que brilha, feed de itens à esquerda */
      .gold-line {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 2px;
        font-size: 11px;
        line-height: 13px;
        color: #ffd23f;
      }
      .gold-line .coin {
        font-size: 10px;
      }
      #p-gold-plus {
        font-size: 10px;
        font-weight: 700;
        color: #fff3b0;
        opacity: 0;
        transform: translateY(2px);
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      #p-gold-plus.show {
        opacity: 1;
        transform: none;
      }
      #p-gold-plus.fade {
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity 0.6s,
          transform 0.6s;
      }
      .bar.xp {
        transition: box-shadow 0.3s;
      }
      .bar.xp.glow {
        box-shadow: 0 0 6px 1px #ffd23f;
      }
      .bar.xp.glow i {
        filter: brightness(1.45);
      }
      #loot-feed {
        position: absolute;
        top: 110px;
        left: 8px;
        width: 200px;
        pointer-events: none !important;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 2px;
        overflow: hidden;
      }
      #loot-feed:empty {
        display: none;
      }
      #loot-feed div {
        background: rgba(10, 12, 20, 0.62);
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 13px;
        font-weight: 600;
        text-shadow: 0 0 3px #000;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        animation: feedIn 0.2s ease-out;
      }
      @keyframes feedIn {
        from {
          opacity: 0;
          transform: translateX(-8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #joystick {
        position: absolute;
        left: 20px;
        bottom: 20px;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.3);
        touch-action: none;
      }
      /* joystick flutuante: área invisível na metade esquerda (embaixo de todo o HUD); o círculo vai para onde o dedo toca */
      #joy-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        touch-action: none;
      }
      #joystick {
        pointer-events: none !important;
        opacity: 0.55;
        transition: opacity 0.15s;
      }
      #joystick.live {
        opacity: 1;
        transition: none;
      }
      #knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        pointer-events: none;
      }
      #btn-attack {
        position: absolute;
        right: 24px;
        bottom: 30px;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: rgba(160, 50, 40, 0.75);
        border: 2px solid #f99;
        font-size: 16px;
        font-weight: 700;
        touch-action: none;
      }
      #attrs-panel,
      #create {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px;
        overflow: auto;
      }
      .card {
        background: #1a1f2e;
        border: 1px solid #667;
        border-radius: 12px;
        padding: 16px;
        width: min(420px, 100%);
        max-height: 100%;
        overflow: auto;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .card h3 {
        margin: 14px 0 4px;
        font-size: 14px;
        color: #cba;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        padding: 4px 2px;
        text-align: left;
      }
      th {
        font-weight: 400;
        color: #99a;
        font-size: 12px;
      }
      td small {
        display: block;
        color: #889;
        font-size: 11px;
      }
      .num {
        text-align: right;
        font-weight: 600;
        width: 60px;
      }
      table.two td {
        padding: 2px;
      }
      td button {
        padding: 2px 12px;
        font-size: 16px;
        background: #2d6a3a;
      }
      td.plus {
        width: 64px;
        text-align: right;
      }
      td.plus button {
        min-width: 52px;
        min-height: 44px;
        font-size: 22px;
      }
      tr.rec td {
        background: rgba(212, 160, 23, 0.1);
      }
      tr.rec td:first-child {
        border-left: 3px solid #d4a017;
        padding-left: 6px;
      }
      td small.why {
        color: #cb9;
        font-style: italic;
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 8px;
        vertical-align: middle;
      }
      .badge.rec {
        background: #d4a017;
        color: #000;
      }
      .badge.opt {
        background: #2a3042;
        color: #aab;
        border: 1px solid #556;
        font-weight: 400;
      }
      button[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      #attrs-panel .card {
        max-height: 100%;
        -webkit-overflow-scrolling: touch;
      }
      #attrs-panel,
      #settings-panel {
        touch-action: pan-y;
      }
      #settings-panel {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px;
        overflow: auto;
      }
      #settings-panel .card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(320px, 100%);
      }
      #bug-panel {
        position: fixed;
        inset: 0;
        z-index: 6;
        display: flex;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px;
        overflow: auto;
        touch-action: pan-y;
      }
      #bug-panel .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, 100%);
        margin: auto;
        flex-shrink: 0;
      }
      #bug-panel textarea {
        min-height: 72px;
        flex-shrink: 0;
      }
      #bug-panel textarea,
      #bug-panel input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 14px;
        color: #e8e2d4;
        background: #0d1118;
        border: 1px solid #445;
        border-radius: 6px;
        padding: 8px;
        resize: vertical;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 16px;
      }
      .opt input {
        width: 22px;
        height: 22px;
      }
      .muted {
        color: #889;
      }
      .sld {
        display: grid;
        grid-template-columns: 70px 1fr 32px;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 16px;
      }
      .sld input {
        width: 100%;
        height: 36px;
        touch-action: none;
        margin: 0;
        padding: 0;
      }
      .sld output {
        text-align: right;
        color: #aab;
        font-size: 14px;
      }
      #btn-settings {
        padding: 6px 10px;
        font-size: 18px;
        line-height: 1;
      }
      #tip-card {
        position: absolute;
        left: 50%;
        bottom: 170px;
        transform: translateX(-50%);
        width: min(380px, calc(100% - 24px));
        background: rgba(20, 26, 40, 0.95);
        border: 1px solid #d4a017;
        border-radius: 10px;
        padding: 10px 12px;
      }
      #tip-card b {
        color: #d4a017;
      }
      #tip-card p {
        margin: 4px 0 8px;
        font-size: 13px;
      }
      #tip-card button {
        width: 100%;
        padding: 8px;
      }
      @media (pointer: coarse) {
        #tip-card {
          top: 176px;
          bottom: auto;
        }
      }
      /* celular deitado baixo (Fold fechado, iPhone deitado no Safari): dica embaixo, no meio, entre joystick/poções e as skills */
      @media (orientation: landscape) and (max-height: 450px) {
        #tip-card {
          top: auto;
          bottom: calc(6px + env(safe-area-inset-bottom));
          width: min(360px, calc(100% - 470px));
          min-width: 240px;
          max-height: calc(100% - 140px);
          overflow: auto;
          padding: 6px 10px;
        }
        #tip-card p {
          font-size: 12px;
          margin: 2px 0 6px;
        }
        #tip-card button {
          padding: 5px;
        }
      }
      .pts b {
        color: #d4a017;
        font-size: 16px;
      }
      .card .primary {
        width: 100%;
        margin-top: 14px;
      }
      #create {
        background: radial-gradient(circle at 50% 30%, #2a3350, #0c0f18);
        z-index: 10;
      }
      #create .card {
        width: min(560px, 100%);
        position: relative;
      }
      #lang-slot {
        position: absolute;
        top: 8px;
        right: 8px;
      }
      .opt .lang-sw {
        margin-left: auto;
      }
      .lang-sw {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .lang-sw button,
      .lang-sw button.primary {
        padding: 4px 9px;
        font-size: 12px;
        line-height: 1.2;
        min-height: 0;
        height: auto;
        width: auto;
        margin: 0;
      }
      #create h1 {
        margin: 0 0 4px;
        font-size: 26px;
        text-align: center;
        letter-spacing: 2px;
      }
      #create p.sub {
        margin: 0 0 14px;
        text-align: center;
        color: #99a;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #ccd;
      }
      #char-name {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #667;
        background: #10141c;
        color: #fff;
        font: inherit;
        font-size: 16px;
        margin-bottom: 12px;
        user-select: text;
        -webkit-user-select: text;
      }
      #char-name.err {
        border-color: #e55;
      }
      #class-cards {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .class-card {
        flex: 1 1 220px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border: 2px solid #445;
        border-left: 6px solid var(--c);
      }
      .class-card.sel {
        border-color: var(--c);
        background: #2f3550;
      }
      .class-card b {
        font-size: 16px;
      }
      .class-card span {
        font-size: 12px;
        color: #fc9;
      }
      .class-card em {
        font-size: 12px;
        color: #bbc;
        font-style: normal;
      }
      .class-card small {
        font-size: 11px;
        color: #889;
      }
      .class-card .master {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 4px;
      }
      .class-card .master img {
        width: 52px;
        height: 52px;
        object-fit: contain;
        flex: none;
        background: #262a3c;
        border-radius: 8px;
      }
      .class-card .master div {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .class-card .master i {
        font-size: 12px;
        color: #cdb;
      }
      .class-card .master strong {
        font-size: 12px;
        color: var(--c);
      }
      .class-card q {
        font-size: 12px;
        color: #dde;
        line-height: 1.45;
        quotes: '“' '”';
      }
      .class-card.locked {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .class-card.locked .soon {
        align-self: flex-start;
        font-size: 11px;
        background: #445;
        color: #ffd;
        padding: 1px 6px;
        border-radius: 6px;
      }
      #btn-start,
      button.wide {
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        min-height: 44px;
      }
      #del-name {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #667;
        background: #10141c;
        color: #fff;
        font: inherit;
        font-size: 16px;
        margin-bottom: 6px;
        user-select: text;
        -webkit-user-select: text;
      }
      button.danger {
        background: #8a2a2a;
        border-color: #f66;
      }
      .slot-card {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        border: 2px solid #445;
        border-left: 6px solid var(--c, #445);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
        background: #222a3e;
      }
      .slot-card.empty {
        border-style: dashed;
        background: transparent;
        color: #99a;
      }
      .slot-info {
        flex: 1 1 180px;
        min-width: 0;
      }
      .slot-info b {
        font-size: 16px;
      }
      .slot-info small {
        display: block;
        color: #aab;
        font-size: 12px;
        margin-top: 2px;
      }
      .slot-btns {
        display: flex;
        gap: 6px;
        flex: 0 0 auto;
      }
      .slot-btns button {
        min-height: 44px;
        min-width: 78px;
      }
      .slot-card.last {
        box-shadow: 0 0 0 1px #d4a017;
      }
      @media (max-width: 480px) {
        .slot-btns {
          width: 100%;
        }
        .slot-btns button {
          flex: 1;
        }
      }
      #create {
        align-items: flex-start;
      }
      #create .card {
        margin: auto;
      }
      #toast {
        white-space: pre-line;
      }
      #hotbar {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .slot {
        position: relative;
        width: 56px;
        height: 56px;
        padding: 0;
        border-radius: 10px;
        border: 2px solid #778;
        background: #1a1f2e;
        overflow: hidden;
        touch-action: none;
        color: #fff;
      }
      .slot .ic {
        position: absolute;
        inset: 4px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 17px;
        text-shadow: 0 1px 3px #000;
        background: var(--c);
      }
      .slot .key {
        position: absolute;
        left: 4px;
        top: 2px;
        font-size: 11px;
        font-weight: 700;
        text-shadow: 0 0 3px #000;
        z-index: 2;
      }
      .slot .sweep {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .slot .cdt {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 800;
        text-shadow: 0 0 4px #000;
        z-index: 2;
      }
      .slot .lock {
        position: absolute;

      #bigmap.hidden {
        display: none;
      }
      #bigmap .bigmap-card {
        width: min(820px, 100%);
        padding: 12px 14px;
      }
      .bigmap-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .bigmap-head h2 {
        margin: 0;
        font-size: 18px;
      }
      .bigmap-head .win-x {
        margin: 0;
        position: static;
      }
      #bigmap-canvas {
        display: block;
        width: 100%;
        height: min(calc(100vh / var(--ui, 1) - 150px), calc((min(820px, 100vw / var(--ui, 1)) - 52px) * 0.54));
        background: #0e1218;
        border-radius: 8px;
      }
      .bigmap-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-top: 8px;
        font-size: 13px;
        color: #ccd;
      }
      .bigmap-legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
        border: 1px solid #000;
        vertical-align: -1px;
      }
      .bigmap-legend i.dia {
        border-radius: 1px;
        transform: rotate(45deg);
      }
      @media (max-width: 640px) {
        #minimap {
          width: 132px;
          height: 72px;
        }
      }
      @media (max-height: 520px) {
        #minimap {
          width: 120px;
          height: 66px;
        }
      }

      /* Celular deitado com pouca altura (ex.: Galaxy Z Fold fechado, ~920x316): tudo compacto, sem sobreposição */
      @media (orientation: landscape) and (max-height: 450px) {
        #player-frame {
          width: 150px;
          padding: 4px 6px;
        }
        #player-frame .line {
          font-size: 11px;
        }
        #target-frame {
          top: 100px;
          left: 8px;
          transform: none;
          width: 180px;
          padding: 4px 6px;
        }
        #top-right {
          flex-direction: row;
          flex-wrap: nowrap;
          align-items: flex-start;
          gap: 5px;
          max-width: none;
        }
        #minimap {
          width: 104px;
          height: 56px;
        }
        #map-name {
          display: none;
        }
        #top-right > button:not(#minimap),
        #auto-row > button {
          min-height: 40px;
          height: 40px;
          padding: 0 10px;
        }
        #btn-auto {
          min-width: 72px;
          font-size: 13px;
        }
        #btn-auto-cfg,
        #btn-settings {
          width: 40px;
          min-width: 40px;
          padding: 0;
        }
        #btn-skills,
        #btn-attrs,
        #btn-bag {
          position: relative;
          width: 40px;
          min-width: 40px;
          padding: 0;
          font-size: 0;
        }
        #btn-skills::before,
        #btn-attrs::before,
        #btn-bag::before {
          font-size: 19px;
          line-height: 40px;
        }
        #btn-skills::before {
          content: '📜';
        }
        #btn-attrs::before {
          content: '💪';
        }
        #btn-bag::before {
          content: '🎒';
        }
        #pts-badge {
          font-size: 11px;
        }
        #dur-warn {
          font-size: 0;
          width: 40px;
          min-width: 40px;
          padding: 0;
        }
        #dur-warn::before {
          content: '⚠';
          font-size: 19px;
          line-height: 40px;
        }
        #joystick {
          width: 96px;
          height: 96px;
          left: 12px;
          bottom: 10px;
        }
        #potion-bar.touch {
          left: 118px;
          bottom: 10px;
        }
        #potion-bar.touch .pot {
          width: 46px;
          height: 46px;
        }
        #btn-attack {
          width: 78px;
          height: 78px;
          right: 14px;
          bottom: 12px;
          font-size: 14px;
        }
        #hotbar.touch .slot {
          width: 46px;
          height: 46px;
        }
        #toast {
          top: 22%;
          font-size: 14px;
          padding: 6px 12px;
        }
        #loot-feed {
          width: 180px;
        }
        #loot-feed div {
          font-size: 11px;
          padding: 1px 6px;
        }
        #boss-bar {
          top: auto;
          bottom: 10px;
          left: 50%;
          transform: translateX(-50%);
          width: min(300px, 40%);
        }
      }
      /* Tela de carregamento (some quando o BootScene termina) */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        background: radial-gradient(circle at 50% 30%, #2a3350, #0c0f18);
        transition: opacity 0.25s;
      }
      #loading.out {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 2px;
        text-align: center;
      }
      #loading .ld-bar {
        width: min(280px, 70vw);
        height: 10px;
        background: #222;
        border: 1px solid #556;
        border-radius: 6px;
        overflow: hidden;
      }
      #loading .ld-bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #d4a017;
        transition: width 0.15s;
      }
      #loading .ld-txt {
        font-size: 12px;
        color: #99a;
      }
      @media (orientation: landscape) and (max-height: 450px) {
        #loading {
          gap: 6px;
        }
      }
      /* Versão discreta no canto do card inicial */
      #create-foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 10px 0 -6px;
      }
      #create-foot #ver-label {
        margin: 0;
      }
      button.link {
        background: none;
        border: none;
        padding: 4px 0;
        font-size: 11px;
        color: #99a;
        text-decoration: underline;
      }
      /* Créditos e licenças (tela inicial e ⚙) */
      #credits-panel {
        position: fixed;
        inset: 0;
        z-index: 35; /* acima da tela inicial (10) e das dicas de item (30); abaixo do carregamento (50) */
        display: flex;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px;
        overflow: auto;
        touch-action: pan-y;
      }
      #credits-panel .card {
        width: min(460px, 100%);
        max-height: none;
        margin: auto;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        user-select: text;
        -webkit-user-select: text;
      }
      #credits-panel p {
        margin: 0;
        font-size: 13px;
      }
      .cr-list {
        margin: 0;
        padding-left: 18px;
        font-size: 13px;
      }
      .cr-list li {
        margin: 0 0 6px;
      }
      .cr-lib {
        font-size: 13px;
        border: 1px solid #445;
        border-radius: 6px;
        padding: 6px 8px;
      }
      .cr-lib summary {
        cursor: pointer;
      }
      .cr-lib pre {
        margin: 8px 0 0;
        max-height: 40vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
        color: #bbc;
      }
      #ver-label {
        margin: 10px 0 -6px;
        text-align: right;
        font-size: 10px;
        color: #667;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status">
      <h1>WANDERERS</h1>
      <div class="ld-bar"><i id="ld-fill"></i></div>
      <div class="ld-txt" id="ld-txt">Carregando…</div>
    </div>
    <div id="game"></div>
    <div id="hud" class="hidden">
      <div id="joy-zone" class="hidden"></div>
      <div id="player-frame" class="frame">
        <div class="line"><b id="p-name"></b><span id="p-level"></span></div>
        <div class="bar hp"><i id="p-hp"></i><span id="p-hp-t"></span></div>
        <div class="bar mp"><i id="p-mp"></i><span id="p-mp-t"></span></div>
        <div class="bar xp"><i id="p-xp"></i><span id="p-xp-t"></span></div>
        <div class="gold-line">
          <span class="coin">&#128176;</span><b id="p-gold">0</b><span id="p-gold-plus"></span>
        </div>
      </div>
      <div id="target-frame" class="frame hidden">
        <div class="line"><b id="t-name"></b><span id="t-level"></span></div>
        <div class="bar hp"><i id="t-hp"></i><span id="t-hp-t"></span></div>
      </div>
      <div id="boss-bar" class="hidden">
        <b id="boss-name"></b>
        <div class="bar hp"><i id="boss-hp"></i><span id="boss-hp-t"></span></div>
      </div>
      <div id="top-right">
        <button id="minimap" type="button"><canvas id="minimap-canvas"></canvas></button>
        <div id="map-name"></div>
        <div id="auto-row">
          <button id="btn-auto">Auto (Z)</button
          ><button id="btn-auto-cfg" aria-label="Menu do auto-combate">&#9776;</button>
        </div>
        <button id="btn-settings" aria-label="Configurações">&#9881;</button>
        <button id="btn-skills">Skills (K)</button>
        <button id="btn-attrs">Atributos (C)<span id="pts-badge" class="hidden"></span></button>
        <button id="btn-bag">Mochila (I)</button>
        <button id="dur-warn" class="hidden" aria-label="Equipamento com pouca durabilidade">&#9888; Reparar</button>
      </div>
      <div id="toast"></div>
      <div id="loot-feed" aria-live="polite"></div>
      <div id="quest-tracker" class="hidden" aria-live="polite"></div>
      <div id="hotbar"></div>
      <div id="skill-tip" class="hidden"></div>
      <div id="potion-bar">
        <button id="pot-hp" class="pot hp" aria-label="Poção de vida">
          <i class="fill"></i><span class="lb"><span data-icon="pocao_hp_p"></span></span><span class="hk"></span
          ><span class="rem"></span><span class="cnt">0</span>
        </button>
        <button id="pot-mp" class="pot mp" aria-label="Poção de mana">
          <i class="fill"></i><span class="lb"><span data-icon="pocao_mp_p"></span></span><span class="hk"></span
          ><span class="rem"></span><span class="cnt">0</span>
        </button>
      </div>
      <div id="joystick" class="hidden"><div id="knob"></div></div>
      <button id="btn-attack" class="hidden">Atacar</button>
      <div id="tip-card" class="hidden">
        <b id="tip-title"></b>
        <p id="tip-text"></p>
        <button id="tip-ok">Entendi</button>
      </div>
      <div id="attrs-panel" class="hidden"></div>
      <div id="skills-panel" class="hidden"></div>
      <div id="inv-panel" class="hidden"></div>
      <div id="npc-panel" class="hidden"></div>
      <div id="item-tip" class="hidden"></div>
      <div id="settings-panel" class="hidden"></div>
      <div id="auto-panel" class="hidden"></div>
      <div id="offline-panel" class="hidden"></div>
      <div id="bigmap" class="hidden"></div>
    </div>
    <div id="create" class="hidden">
      <div class="card">
        <div id="lang-slot"></div>
        <h1>WANDERERS</h1>
        <div id="slots-view">
          <p class="sub" id="sub-slots">Escolha seu personagem</p>
          <div id="slot-list"></div>
        </div>
        <div id="create-view" class="hidden">
          <p class="sub" id="sub-create">Criar personagem</p>
          <label for="char-name" id="lbl-name">Nome</label>
          <input id="char-name" maxlength="16" placeholder="Seu nome" autocomplete="off" />
          <label id="lbl-sect">Seita</label>
          <div id="class-cards"></div>
          <button id="btn-start" class="primary">Começar jornada</button>
          <button id="btn-back" class="wide">Voltar</button>
        </div>
        <div id="del-view" class="hidden">
          <p class="sub" id="del-msg"></p>
          <input id="del-name" maxlength="16" placeholder="Digite o nome do personagem" autocomplete="off" />
          <button id="btn-del-ok" class="danger wide" disabled>Apagar personagem</button>
          <button id="btn-del-cancel" class="wide">Cancelar</button>
        </div>
        <div id="create-foot">
          <button id="btn-credits" class="link">Créditos e licenças</button>
          <div id="ver-label"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
