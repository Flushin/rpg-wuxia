<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mistpeak</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#10141c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mistpeak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <div id="loading" role="status">
      <h1>MISTPEAK</h1>
      <div class="ld-bar"><i id="ld-fill"></i></div>
      <div class="ld-txt" id="ld-txt">Carregando…</div>
    </div>
    <div id="game"></div>
    <div id="hud" class="hidden">
      <div id="joy-zone" class="hidden"></div>
      <div id="player-frame" class="frame" title="Subir de nível (U)">
        <div class="line"><b id="p-name"></b><span id="p-level"></span></div>
        <div class="bar hp"><i id="p-hp"></i><span id="p-hp-t"></span></div>
        <div class="bar mp"><i id="p-mp"></i><span id="p-mp-t"></span></div>
        <div class="bar xp"><i id="p-xp"></i><span id="p-xp-t"></span></div>
        <div class="gold-line">
          <span class="coin">&#128176;</span><b id="p-gold">0</b><span id="p-gold-plus"></span>
        </div>
      </div>
      <div id="target-frame" class="frame hidden">
        <div class="line"><b id="t-name"></b><span id="t-level"></span></div>
        <div class="bar hp"><i id="t-hp"></i><span id="t-hp-t"></span></div>
      </div>
      <div id="boss-bar" class="hidden">
        <b id="boss-name"></b>
        <div class="bar hp"><i id="boss-hp"></i><span id="boss-hp-t"></span></div>
      </div>
      <div id="top-right">
        <button id="minimap" type="button"><canvas id="minimap-canvas"></canvas></button>
        <div id="map-name"></div>
        <div id="auto-row">
          <button id="btn-auto">Auto (Z)</button
          ><button id="btn-auto-cfg" aria-label="Menu do auto-combate">&#9776;</button>
        </div>
        <button id="btn-menu" class="hidden" aria-label="Menu" aria-expanded="false">&#9776;</button>
        <div id="hud-menu" class="hidden"></div>
        <button id="btn-settings" aria-label="Configurações">&#9881;</button>
        <button id="btn-skills">Skills (K)</button>
        <button id="btn-attrs">Personagem (C)<span id="pts-badge" class="hidden"></span></button>
        <button id="btn-bag">Mochila (I)</button>
        <button id="dur-warn" class="hidden" aria-label="Equipamento com pouca durabilidade">&#9888; Reparar</button>
      </div>
      <div id="toast"></div>
      <div id="loot-feed" aria-live="polite"></div>
      <div id="quest-tracker" class="hidden" aria-live="polite"></div>
      <div id="hotbar"></div>
      <div id="skill-tip" class="hidden"></div>
      <div id="potion-bar">
        <button id="pot-hp" class="pot hp" aria-label="Poção de vida">
          <i class="fill"></i><span class="lb"><span data-icon="pocao_hp_p"></span></span><span class="hk"></span
          ><span class="rem"></span><span class="cnt">0</span>
        </button>
        <button id="pot-mp" class="pot mp" aria-label="Poção de mana">
          <i class="fill"></i><span class="lb"><span data-icon="pocao_mp_p"></span></span><span class="hk"></span
          ><span class="rem"></span><span class="cnt">0</span>
        </button>
      </div>
      <div id="joystick" class="hidden"><div id="knob"></div></div>
      <button id="btn-attack" class="hidden">Atacar</button>
      <div id="tip-card" class="hidden">
        <b id="tip-title"></b>
        <p id="tip-text"></p>
        <button id="tip-ok">Entendi</button>
      </div>
      <div id="attrs-panel" class="hidden"></div>
      <div id="skills-panel" class="hidden"></div>
      <div id="inv-panel" class="hidden"></div>
      <div id="npc-panel" class="hidden"></div>
      <div id="dungeon-panel" class="hidden"></div>
      <div id="trial-panel" class="hidden"></div>
      <div id="item-tip" class="hidden"></div>
      <div id="settings-panel" class="hidden"></div>
      <div id="auto-panel" class="hidden"></div>
      <div id="offline-panel" class="hidden"></div>
      <div id="bigmap" class="hidden"></div>
    </div>
    <div id="create" class="hidden">
      <div class="card">
        <div id="lang-slot"></div>
        <h1>MISTPEAK</h1>
        <div id="slots-view">
          <p class="sub" id="sub-slots">Escolha seu personagem</p>
          <div id="slot-list"></div>
        </div>
        <div id="create-view" class="hidden">
          <p class="sub" id="sub-create">Criar personagem</p>
          <label for="char-name" id="lbl-name">Nome</label>
          <input id="char-name" maxlength="16" placeholder="Seu nome" autocomplete="off" />
          <label id="lbl-sect">Seita</label>
          <div id="class-cards"></div>
          <button id="btn-start" class="primary">Começar jornada</button>
          <button id="btn-back" class="wide">Voltar</button>
        </div>
        <div id="del-view" class="hidden">
          <p class="sub" id="del-msg"></p>
          <input id="del-name" maxlength="16" placeholder="Digite o nome do personagem" autocomplete="off" />
          <button id="btn-del-ok" class="danger wide" disabled>Apagar personagem</button>
          <button id="btn-del-cancel" class="wide">Cancelar</button>
        </div>
        <div id="create-foot">
          <span class="foot-links">
            <button id="btn-news" class="link">
              <span id="btn-news-txt">Novidades</span><span class="news-dot hidden" data-news-dot></span>
            </button>
            <button id="btn-credits" class="link">Créditos e licenças</button>
            <button id="btn-privacy" class="link">Privacidade</button>
          </span>
          <div id="ver-label"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
