# Gera o APK de teste (debug) do app Android sob demanda (aba Actions → "APK Android" → Run workflow) e nos PRs
# que mexem em arquivos do lado Android (lista em `paths`); PR só de conteúdo/wiki não gera APK.
# O APK fica no fim da página da execução, em "Artifacts" (mistpeak-debug-apk). Instalar no celular: ver docs/android.md.
# A pasta android/ não está no repositório: é gerada aqui a partir do capacitor.config.ts.
name: APK Android
on:
  pull_request:
    paths:
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - assets/**
      - src/platform/**
      - tools/android-*.mjs
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:prepare
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mistpeak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
