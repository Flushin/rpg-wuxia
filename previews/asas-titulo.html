<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asas do Título</title>
<style>
  :root { --bg: #14171f; --card: #1c2130; --line: #2c3346; --tx: #e8e6df; --mut: #9aa0ad; --gold: #f5c46b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.4 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--mut); margin: 0 0 14px; max-width: 900px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; color: var(--mut); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: hidden; }
  .card h2 { font-size: 15px; margin: 0 0 2px; } .card h2 b { color: var(--gold); margin-right: 6px; }
  .card small { color: var(--mut); display: block; margin-bottom: 8px; min-height: 2.8em; }
  .stage { border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 26px 4px 10px; }
  .map { background: repeating-conic-gradient(#8e8e86 0 25%, #a3a39b 0 50%) 0 0 / 36px 36px; }
  .ui { background: #262a33; margin-top: 8px; }
  .zoom { background: #10131a; margin-top: 8px; padding: 40px 4px 18px; }
  .t { white-space: nowrap; display: inline-flex; align-items: center; font-weight: 700; font-size: 13px; }
  .t > span { background: linear-gradient(180deg, #fff6c8, #f5c46b 55%, #c8892a); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 1px; }
  .map .t > span { filter: drop-shadow(0 0 1px #2a1600) drop-shadow(0 0 1px #2a1600); }
  .zoom .t { font-size: 19px; }
  .name { color: #9fe8a0; font: 700 12px monospace; text-shadow: 0 0 2px #000, 0 0 2px #000; }
  .w { display: inline-block; flex: none; overflow: visible; margin: 0 -0.35em; translate: 0 -22%; }
  .w g.tipflap { transform-box: view-box; transform-origin: 22px -3px; animation: tipflap var(--dur, 1s) infinite; }
  @keyframes tipflap { 0% { transform: rotate(-4deg); } 20% { transform: rotate(-4deg); } 50% { transform: rotate(9deg); } 100% { transform: rotate(-4deg); } }
  .w.r { transform: scaleX(-1); }
  .w g.flap { transform-box: view-box; transform-origin: 34px 30px; animation: var(--anim, flap) var(--dur, 1s) infinite; }
  /* bater de anjo: desce rápido (força), sobe devagar */
  @keyframes flap {
    0% { transform: rotate(8deg); animation-timing-function: cubic-bezier(.5,0,.8,.6); }
    35% { transform: rotate(-13deg) scaleX(.9); animation-timing-function: ease-in-out; }
    100% { transform: rotate(8deg); }
  }
  @keyframes soft { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-7deg) scaleY(.95); } }
  @keyframes flutter { 0%,100% { transform: rotate(6deg) scaleX(1); } 50% { transform: rotate(-10deg) scaleX(.7); } }
  @keyframes glow { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  .shine { animation: glow 1.6s ease-in-out infinite; }
  button { background: #2c3346; color: var(--tx); border: 1px solid #3b4460; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { background: #8a3a2a; border-color: #b0513d; }
</style>
</head>
<body>
<h1>Asas fofinhas (estilo da nº 9) para o «Discípulo Fundador»</h1>
<p class="sub">Variações de formato no estilo da fofinha (nº 9). A cor é a mesma em todas, de propósito: escolhemos o formato agora e a cor depois. Cada cartão mostra no mapa (tamanho real), numa janela e ampliada.</p>
<div class="bar">Velocidade:
  <button data-s="1.5">Lenta</button><button data-s="1" class="on">Normal</button><button data-s=".6">Rápida</button>
</div>
<div class="grid" id="grid"></div>
<script>
// Asa ESQUERDA num viewBox -16..40 x -4..48. Ombro (base) em (36,30), junto do texto.
// O braço sobe quase reto até o "punho" e curva para fora; as penas penduram para baixo e para fora,
// as longas (rêmiges) na ponta. A ponta tem um grupo próprio que bate com um pequeno atraso (mais natural).
let P = { b: [34, 30], c1: [37, 6], c2: [26, -5], t: [12, -1] };
const armPt = (t) => {
  const u = 1 - t, k = [u * u * u, 3 * u * u * t, 3 * u * t * t, t * t * t];
  return [0, 1].map((j) => k[0] * P.b[j] + k[1] * P.c1[j] + k[2] * P.c2[j] + k[3] * P.t[j]);
};
// pena: folha afinada ao longo de +x (depois girada); shape: leaf | round | sharp
function feather(x, y, len, w, ang, fill, stroke, sw, shape = 'leaf') {
  let d;
  if (shape === 'round') d = `M0 ${-w * .6} L${len - w} ${-w} A${w} ${w} 0 0 1 ${len - w} ${w} L0 ${w * .6}Z`;
  else if (shape === 'sharp') d = `M0 ${-w * .7} L${len * .72} ${-w} L${len} ${w * .2} L${len * .7} ${w} L0 ${w * .7}Z`;
  else d = `M0 ${-w * .5} C${len * .4} ${-w * 1.15} ${len * .82} ${-w * .95} ${len} ${w * .15} C${len * .78} ${w * .95} ${len * .35} ${w * 1.05} 0 ${w * .5}Z`;
  return `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${ang.toFixed(1)})"/>`;
}
// fileira de penas ao longo do braço; desenha de fora para dentro (as de dentro por cima)
function row(o) {
  const { n, t0 = .12, t1 = 1, len, w, a0 = 98, a1 = 136, fill, stroke, sw = .7, shape, off = 0, tip } = o;
  let s = '';
  for (let i = n - 1; i >= 0; i--) {
    const t = t0 + (t1 - t0) * (i / (n - 1));
    const [x, y] = armPt(t);
    const L = typeof len === 'function' ? len(t) : len;
    const a = a0 + (a1 - a0) * t ** 1.4;
    const r = (a * Math.PI) / 180;
    const px = x + Math.cos(r) * off, py = y + Math.sin(r) * off;
    s += feather(px, py, L, w, a, typeof fill === 'function' ? fill(t) : fill, stroke, sw, shape);
    if (tip) s += feather(px + Math.cos(r) * L * .58, py + Math.sin(r) * L * .58, L * .42, w * .85, a, tip, stroke, sw, shape);
  }
  return s;
}
const arm = (fill, stroke, sw = 1.2) => { const armD = `M${P.b} C${P.c1} ${P.c2} ${P.t}`; return (
  `<path d="${armD}" fill="none" stroke="${stroke}" stroke-width="${sw + 2.6}" stroke-linecap="round"/>` +
  `<path d="${armD}" fill="none" stroke="${fill}" stroke-width="${sw + .8}" stroke-linecap="round"/>`); };
const grad = (id, stops, x2 = 0, y2 = 1) =>
  `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map((c, i) => `<stop offset="${i / (stops.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient>`;
const blur = (id, sd = 1.6) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${sd}"/></filter>`;
const LONG = (t) => 12 + 27 * t ** 1.3;
// a ponta (rêmiges, t > .55) fica num grupo que gira em volta do punho com atraso
const tipG = (inner) => `<g class="tipflap">${inner}</g>`;

// receita de anjo em 3 camadas: rêmiges (longas na ponta), secundárias, coberteiras curtas junto do braço
const angel = (c, extra = {}) => (u) => {
  const L = (o) => row({ ...o, shape: o.shape ?? extra.shape });
  const prim = (o) => tipG(L({ ...o, t0: .55 })) + L({ ...o, t1: .55, n: Math.ceil(o.n / 2) });
  return (c.defs ? c.defs(u) : '') +
    (c.glow ? `<g class="shine" filter="url(#${u}g)">${prim({ n: 12, len: LONG, w: 3.6, fill: c.glow, stroke: 'none', sw: 0 })}</g>` : '') +
    prim({ n: 12, len: LONG, w: 3.3, fill: c.p(u), stroke: c.s, tip: c.tip }) +
    L({ n: 9, t1: .9, len: (t) => 9 + 9 * t, w: 3.1, fill: c.m(u), stroke: c.s, off: .6 }) +
    L({ n: 8, t1: .85, len: (t) => 5 + 3 * t, w: 2.9, fill: c.f(u), stroke: c.s, off: .3, shape: extra.round ? 'round' : extra.shape }) +
    arm(c.f(u), c.s);
};

// ---- variações no estilo "fofinha" (mesma cor: branco com contorno dourado; a cor muda depois) ----
const F = '#fffdf5', F2 = '#ffffff', S = '#b37a22', S2 = '#e2c38a';
const DEF_ARM = { b: [34, 30], c1: [37, 6], c2: [26, -5], t: [12, -1] };
const withArm = (a, fn) => (u) => { P = { ...DEF_ARM, ...a }; const r = fn(u); P = DEF_ARM; return r; };
const R = (o) => row({ fill: F, stroke: S, sw: .9, shape: 'round', ...o });
const circ = (x, y, r, fill = F, sw = .9) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${S}" stroke-width="${sw}"/>`;
const sparkle = (x, y, k, d = 0) => `<path class="shine" style="animation-delay:${d}s" d="M${x} ${y - k} L${x + k * .28} ${y - k * .28} L${x + k} ${y} L${x + k * .28} ${y + k * .28} L${x} ${y + k} L${x - k * .28} ${y + k * .28} L${x - k} ${y} L${x - k * .28} ${y - k * .28}Z" fill="#fff6c8" stroke="${S}" stroke-width=".5"/>`;

const WINGS = [
  { n: 'Fofinha (a nº 9)', d: 'A original: poucas penas redondas e grandes.', anim: 'soft',
    svg: withArm({}, () => R({ n: 6, len: (t) => 10 + 12 * t, w: 4.4 }) + R({ n: 4, t1: .75, len: (t) => 5 + 3 * t, w: 3.4, fill: F2, off: .3 }) + arm(F2, S, 1.6)) },
  { n: 'Nuvenzinha', d: 'Uma peça só, fofa como nuvem, com a barra de baixo em ondinhas.', anim: 'soft',
    svg: () => `<path d="M34 30 C36 14 30 0 16 -2 C6 -3 2 4 4 9 C0 11 0 17 4 18 C1 21 3 27 8 26 C7 31 12 34 16 31 C17 35 24 36 26 32 C28 35 33 34 34 30Z" fill="${F}" stroke="${S}" stroke-width="1.2" stroke-linejoin="round"/>` +
      `<path d="M8 14 C14 14 20 17 26 22 M10 22 C15 22 21 24 27 27" fill="none" stroke="${S2}" stroke-width="1" stroke-linecap="round"/>` },
  { n: 'Três gotas', d: 'Só três penas grandes em forma de gota, bem simples.', anim: 'soft',
    svg: withArm({}, () => row({ n: 3, t0: .2, len: (t) => 14 + 12 * t, w: 5.6, a0: 100, a1: 140, fill: F, stroke: S, sw: 1 }) + arm(F2, S, 1.8)) },
  { n: 'Pelúcia', d: 'Curta e gordinha: quatro penas bem largas e contorno grosso.', anim: 'soft',
    svg: withArm({ c1: [36, 12], c2: [28, 2], t: [16, 4] }, () => R({ n: 4, len: (t) => 9 + 7 * t, w: 5.8, sw: 1.3 }) + R({ n: 3, t1: .7, len: 5, w: 4.4, fill: F2, sw: 1.3, off: .3 }) + arm(F2, S, 2.2)) },
  { n: 'Bolinhas', d: 'As penas viram bolinhas que diminuem até a ponta. Bem chibi.', anim: 'soft',
    svg: withArm({}, () => { let o = ''; for (let i = 6; i >= 0; i--) { const t = .15 + .85 * i / 6; const [x, y] = armPt(t); const r = 5.5 - 2.4 * t; o += circ(x - 2 - 8 * t, y + 5 + 8 * t, r); o += circ(x - 1, y + 1.5, r * .75, F2); } return o + arm(F2, S, 1.4); }) },
  { n: 'Coraçãozinho', d: 'O contorno lembra meio coração; duas penas desenhadas dentro.', anim: 'soft',
    svg: () => `<path d="M34 30 C33 20 30 8 20 2 C12 -3 2 2 3 11 C4 20 18 27 26 33 C29 35 33 34 34 30Z" fill="${F}" stroke="${S}" stroke-width="1.2" stroke-linejoin="round"/>` +
      `<path d="M9 9 C15 12 21 18 26 26 M16 4 C21 8 25 14 29 22" fill="none" stroke="${S2}" stroke-width="1" stroke-linecap="round"/>` },
  { n: 'Escamas', d: 'Três fileiras de penas curtinhas, como escamas.', anim: 'soft',
    svg: withArm({}, () => R({ n: 7, len: (t) => 9 + 9 * t, w: 3.4 }) + R({ n: 6, t1: .85, len: (t) => 6 + 4 * t, w: 3.2, fill: F2, off: .4 }) + R({ n: 5, t1: .7, len: 4, w: 3, fill: F2, off: .2 }) + arm(F2, S, 1.4)) },
  { n: 'Fofa comprida', d: 'Mesmas penas redondas, só que mais finas e longas: mais elegante.', anim: 'soft',
    svg: withArm({}, () => R({ n: 8, len: (t) => 12 + 18 * t, w: 2.9 }) + R({ n: 6, t1: .8, len: (t) => 6 + 4 * t, w: 2.8, fill: F2, off: .3 }) + arm(F2, S, 1.3)) },
  { n: 'Dois gominhos', d: 'Mini: só duas penas grandes. A mais discreta.', anim: 'soft',
    svg: withArm({ c1: [36, 14], c2: [30, 6], t: [20, 6] }, () => row({ n: 2, t0: .3, len: (t) => 12 + 6 * t, w: 6, a0: 105, a1: 135, fill: F, stroke: S, sw: 1.1, shape: 'round' }) + arm(F2, S, 2)) },
  { n: 'Ponta enrolada', d: 'Fofinha com um caracol (espiral) no alto da asa, estilo nuvem chinesa.', anim: 'soft',
    svg: withArm({}, () => R({ n: 6, len: (t) => 10 + 12 * t, w: 4.2 }) + R({ n: 4, t1: .75, len: (t) => 5 + 3 * t, w: 3.4, fill: F2, off: .3 }) + arm(F2, S, 1.6) +
      `<path d="M12 -1 C6 -2 4 4 8 5 C11 6 12 2 9 2" fill="none" stroke="${S}" stroke-width="1.6" stroke-linecap="round"/>`) },
  { n: 'Aberta', d: 'Fofinha mais aberta para o lado, como se estivesse voando.', anim: 'soft',
    svg: withArm({ c1: [36, 10], c2: [22, -2], t: [4, 4] }, () => row({ n: 6, len: (t) => 9 + 11 * t, w: 4.2, a0: 100, a1: 150, fill: F, stroke: S, sw: .9, shape: 'round' }) +
      row({ n: 4, t1: .75, len: (t) => 5 + 3 * t, w: 3.4, a0: 100, a1: 150, fill: F2, stroke: S, sw: .9, shape: 'round', off: .3 }) + arm(F2, S, 1.6)) },
  { n: 'Com estrelinhas', d: 'A fofinha com estrelinhas piscando em volta.', anim: 'soft',
    svg: withArm({}, () => R({ n: 6, len: (t) => 10 + 12 * t, w: 4.4 }) + R({ n: 4, t1: .75, len: (t) => 5 + 3 * t, w: 3.4, fill: F2, off: .3 }) + arm(F2, S, 1.6) +
      sparkle(2, 6, 3) + sparkle(-2, 22, 2.2, .5) + sparkle(8, 34, 2.6, 1)) },
  { n: 'Batendo rápido', d: 'A fofinha original, mas batendo rápido como um passarinho.', anim: 'flap', dur: .45,
    svg: withArm({}, () => R({ n: 6, len: (t) => 10 + 12 * t, w: 4.4 }) + R({ n: 4, t1: .75, len: (t) => 5 + 3 * t, w: 3.4, fill: F2, off: .3 }) + arm(F2, S, 1.6)) },
];

let uid = 0;
const wing = (w, px, right) => `<svg class="w${right ? ' r' : ''}" viewBox="-16 -8 54 62" width="${px}" height="${px * 62 / 54}" style="${w.anim ? `--anim:${w.anim};` : ''}${w.dur ? `--dur:${w.dur}s` : ''}"><g class="flap">${w.svg('w' + uid++)}</g></svg>`;
const title = (w, px) => `<span class="t">${wing(w, px)}<span>Discípulo Fundador</span>${wing(w, px, 1)}</span>`;
document.getElementById('grid').innerHTML = WINGS.map((w, i) => `<div class="card"><h2><b>${i + 1}</b>${w.n}</h2><small>${w.d}</small>
  <div class="stage map">${title(w, 30)}<span class="name">Lucas</span></div>
  <div class="stage ui">${title(w, 30)}</div>
  <div class="stage zoom">${title(w, 50)}</div></div>`).join('');
document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => {
  document.querySelectorAll('[data-s]').forEach((x) => x.classList.toggle('on', x === b));
  document.documentElement.style.setProperty('--dur', b.dataset.s + 's');
});
</script>
</body>
</html>
