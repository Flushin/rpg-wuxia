<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ultimate do Titã</title>
    <style>
      :root {
        --bg: #140c0a;
        --panel: #22140f;
        --acc: #ff9a3a;
        --txt: #f3e6da;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: system-ui, sans-serif;
        padding-block: 16px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 4px;
        color: var(--acc);
      }
      p {
        margin: 0 0 10px;
        opacity: 0.85;
        font-size: 14px;
        max-width: 820px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .card {
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
        width: min(100%, 720px);
      }
      canvas {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 4/3;
        border-radius: 8px;
        display: block;
        background: #1a2a1e;
      }
      .card button {
        margin-top: 8px;
        background: var(--acc);
        color: #2a1004;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 15px;
        font-weight: 700;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Ultimate do Titã: 3 ideias</h1>
    <p>
      Seita do Titã: fogo e terra, dano físico, corpo a corpo (raio menor, em volta dele). Cores: miolo amarelo-claro,
      corpo laranja, brilho vermelho-brasa. Os monstros atingidos ficam tontos (atordoados) no fim.
    </p>

        ctx.fill();
        ctx.shadowBlur = 0;
        // sobrancelhas em V (bravo), olhos em brasa e boca aberta rugindo
        ctx.fillStyle = 'rgba(90,15,5,.95)';
        ctx.beginPath();
        ctx.moveTo(-25, -120);
        ctx.lineTo(-2, -106);
        ctx.lineTo(-3, -101);
        ctx.lineTo(-25, -113);
        ctx.moveTo(25, -120);
        ctx.lineTo(2, -106);
        ctx.lineTo(3, -101);
        ctx.lineTo(25, -113);
        ctx.fill();
        ctx.shadowColor = '#ffec80';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#fffbe0';
        ctx.beginPath();
        ctx.moveTo(-20, -104);
        ctx.lineTo(-5, -100);
        ctx.lineTo(-18, -97);
        ctx.moveTo(20, -104);
        ctx.lineTo(5, -100);
        ctx.lineTo(18, -97);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(60,8,2,.95)';
        ctx.beginPath();
        ctx.ellipse(0, -86, 10, 6 + Math.sin(t / 120) * 1.5, 0, 0, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,200,80,.9)';
        ctx.beginPath();
        ctx.ellipse(0, -85, 5, 3, 0, 0, 7);
        ctx.fill();
        // barba de fogo descendo pelo peito
        const bd = new Path2D();
        bd.moveTo(-24, -92);
        for (let q = 0; q <= 8; q++) {
          const xx = -24 + q * 6,
            yy = -60 + (q % 2 ? -10 : 8) + Math.sin(t / 90 + q) * 3 - Math.abs(q - 4) * 4;
          bd.lineTo(xx, yy);
        }
        bd.lineTo(24, -92);
        bd.quadraticCurveTo(14, -78, 0, -80);
        bd.quadraticCurveTo(-14, -78, -24, -92);
        const dg = ctx.createLinearGradient(0, -96, 0, -50);
        dg.addColorStop(0, 'rgba(255,240,190,.95)');
        dg.addColorStop(1, 'rgba(255,140,40,.6)');
        ctx.fillStyle = dg;
        ctx.fill(bd);
        // chamas na borda dos ombros e na cabeça
        for (const [fx, fy, h] of [
          [-104, -66, 30],
          [-70, -76, 24],
          [70, -76, 24],
          [104, -66, 30],
          [-14, -134, 22],
          [0, -138, 30],
          [14, -134, 22],
        ])
          flame(ctx, fx + Math.sin(t / 70 + fx) * 2, fy + 6, h + Math.random() * 8, 9, 0.8);
        ctx.restore();
      }
      function make(i) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h2>${V[i][0]}</h2><p>${V[i][1]}</p><canvas width="${W}" height="${H}"></canvas><button>🔥 Soltar de novo</button>`;
        g.appendChild(card);
        const cv = card.querySelector('canvas'),
          ctx = cv.getContext('2d');
        let t0, M, nums, parts, fx, last, boom, cracks, rocks;
        const armDown = [0, 0];
        const reset = (now) => {
          t0 = now;
          M = mobs();
          nums = [];
          parts = [];
          fx = [];
          last = -1;
          boom = false;
          cracks = M.map((m) => {
            const P = [[CX, CY]];
            for (let s = 1; s <= 7; s++) {
              const k = s / 7;
              P.push([CX + (m.x - CX) * k + rnd(-10, 10), CY + (m.y - CY) * k + rnd(-6, 6)]);
            }
            return P;
          });
          rocks = [];
        };
        reset(performance.now());
        card.querySelector('button').onclick = () => reset(performance.now());
        const hit = (m, dmg, big) => {
          m.hit = 1;
          m.burn = Math.min(1, m.burn + 0.3);
          nums.push({ x: m.x + rnd(-10, 10), y: m.y - 30, v: dmg, t: 0, big });
          for (let k = 0; k < 8; k++) parts.push({ x: m.x, y: m.y - 6, vx: rnd(-2.5, 2.5), vy: rnd(-5, -1), t: 0 });
        };
        function frame(now) {
          let t = Math.max(0, now - t0);
          if (t > PRE + DUR + POST + 1200) {
            reset(now);
            t = 0;
          }
          const act = t > PRE && t < PRE + DUR,
            p = (t - PRE) / DUR,
            fin = t >= PRE + DUR && t < PRE + DUR + POST,
            fp = (t - PRE - DUR) / POST;
          const tick = Math.floor(t / 90),
            newTick = tick !== last;
          last = tick;
          ctx.save();
          const sh = act ? (i === 1 ? 4 : 3) : fin && fp < 0.35 ? 14 * (1 - fp / 0.35) : 0;
          ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
          // chão
          ctx.fillStyle = '#24382a';
          ctx.fillRect(-20, -20, W + 40, H + 40);
          ctx.fillStyle = '#2c4432';
          for (let y = 0; y < H; y += 40) for (let x = ((y / 40) % 2) * 40; x < W; x += 80) ctx.fillRect(x, y, 40, 40);
          const tint = t < PRE ? (t / PRE) * 0.45 : act ? 0.45 : fin ? 0.45 * (1 - Math.max(0, fp - 0.4) / 0.6) : 0;
          ctx.fillStyle = `rgba(40,8,0,${tint})`;
          ctx.fillRect(-20, -20, W + 40, H + 40);
          // brasa no chão em volta (todas)
          if (t < PRE + DUR + POST) {
            const k = t < PRE ? t / PRE : fin ? 1 - fp : 1;
            ctx.save();
            ctx.translate(CX, CY);
            ctx.scale(1.25, 0.6);
            const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 120 * k + 1);
            gr.addColorStop(0, `rgba(255,120,30,${0.35 * k})`);
            gr.addColorStop(1, 'rgba(255,60,10,0)');
            ctx.fillStyle = gr;
            ctx.beginPath();
            ctx.arc(0, 0, 120 * k + 1, 0, 7);
            ctx.fill();
            ctx.restore();
          }
          // A: rachaduras de lava
          if (i === 0 && t > PRE * 0.5 && t < PRE + DUR + POST) {
            const grow = Math.min(1, (t - PRE * 0.5) / 500),
              a = fin ? 1 - fp : 1;
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            cracks.forEach((P) => {
              const n = Math.max(1, Math.floor(grow * (P.length - 1)));
              const path = () => {
                ctx.beginPath();
                ctx.moveTo(...P[0]);
                P.slice(1, n + 1).forEach((q) => ctx.lineTo(...q));
              };
              path();
              ctx.strokeStyle = `rgba(40,10,5,${0.9 * a})`;
              ctx.lineWidth = 7;
              ctx.stroke();
              path();
              ctx.strokeStyle = `rgba(255,90,20,${(0.8 + Math.sin(t / 80) * 0.2) * a})`;
              ctx.shadowColor = '#ff5a10';
              ctx.shadowBlur = 14;
              ctx.lineWidth = 3.5;
              ctx.stroke();
              path();
              ctx.strokeStyle = `rgba(255,230,150,${0.9 * a})`;
              ctx.shadowBlur = 0;
              ctx.lineWidth = 1.2;
              ctx.stroke();
            });
            ctx.restore();
          }
          // B: gigante de brasa atrás dele
          if (i === 1 && t > PRE * 0.4 && t < PRE + DUR + POST * 0.6) {
            const k = Math.min(1, (t - PRE * 0.4) / 400),
              a = fin ? Math.max(0, 1 - fp / 0.6) : 1;
            giant(ctx, CX, CY - 78 - (1 - k) * 30, 0.75 * k * a, t, armDown);
          }
          armDown[0] = Math.max(0, armDown[0] - 1);
          armDown[1] = Math.max(0, armDown[1] - 1);
          // C: anel de fogo no chão
          if (i === 2 && act) {
            ctx.save();
            ctx.translate(CX, CY);
            ctx.scale(1.25, 0.6);
            ctx.strokeStyle = 'rgba(255,140,40,.8)';
            ctx.shadowColor = '#ff5a10';
            ctx.shadowBlur = 20;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, 40 + Math.sin(t / 120) * 4, 0, 7);
            ctx.stroke();
            ctx.restore();
          }
          // monstros
          M.forEach((m) => {
            const px = m.x + Math.cos(m.a) * m.push * 40,
              py = m.y + Math.sin(m.a) * m.push * 22;
            ctx.fillStyle = '#0005';
            ctx.beginPath();
            ctx.ellipse(px, py + 12, 16, 5, 0, 0, 7);
            ctx.fill();
            ctx.fillStyle = m.hit > 0 ? '#fff' : m.c;
            ctx.beginPath();
            ctx.ellipse(px, py - 4, 14, 16, 0, 0, 7);
            ctx.fill();
            if (m.burn > 0) {
              ctx.fillStyle = `rgba(255,110,30,${0.45 * m.burn})`;
              ctx.beginPath();
              ctx.ellipse(px, py - 4, 14, 16, 0, 0, 7);
              ctx.fill();
            }
            ctx.fillStyle = '#000';
            ctx.fillRect(px - 6, py - 8, 3, 3);
            ctx.fillRect(px + 3, py - 8, 3, 3);
            if (m.stun > 0) {
              for (let k = 0; k < 3; k++) {
                const a = t / 200 + (k * Math.PI * 2) / 3;
                ctx.fillStyle = `rgba(255,230,120,${m.stun})`;
                ctx.font = '12px system-ui';
                ctx.fillText('★', px + Math.cos(a) * 14 - 5, py - 30 + Math.sin(a) * 4);
              }
            }
            m.hit = Math.max(0, m.hit - 0.12);
          });
          // personagem
          const fi = Math.floor(t / 110) % 8;
          if (spr.complete) {
            ctx.save();
            if (act || t < PRE) {
              ctx.shadowColor = '#ff8a2a';
              ctx.shadowBlur = 25;
            }
            const lev = act ? Math.min(1, p * 5) * 10 + Math.sin(t / 200) * 2 : 0;
            ctx.drawImage(spr, fi * 120, 0, 120, 140, CX - 48, CY - 110 - lev, 96, 112);
            ctx.restore();
          }
          // C: ciclone de chamas em volta dele (na frente)
          if (i === 2 && (act || (fin && fp < 0.15))) {
            const grow = act ? Math.min(1, p * 3) : 1;
            for (let k = 0; k < 26; k++) {
              const a = t / 140 + k * 0.9,
                r = (30 + (k % 5) * 14) * grow,
                h = 30 + (k % 4) * 14;
              const x = CX + Math.cos(a) * r * 1.3,
                y = CY + Math.sin(a) * r * 0.5 - (k % 6) * 10;
              if (Math.sin(a) < -0.2) continue; // as de trás já ficam atrás do corpo
              flame(ctx, x, y, h, 9, 0.75);
            }
            if (newTick && tick % 4 === 0) fx.push({ k: 'pulse', t: 0 });
          }
          // A: gêiseres
          if (i === 0 && act && newTick) {
            const m = M[Math.floor(Math.random() * M.length)];
            fx.push({ k: 'geyser', m, t: 0 });
            if (Math.random() < 0.5) fx.push({ k: 'geyser', m: M[Math.floor(Math.random() * M.length)], t: 0 });
          }
          // B: punhos
          if (i === 1 && act && newTick && tick % 2 === 0) {
            const side = tick % 4 === 0 ? 0 : 1,
              pool = M.filter((m) => m.x < CX === (side === 0)),
              m = (pool.length ? pool : M)[Math.floor(Math.random() * (pool.length || M.length))];
            fx.push({ k: 'fist', m, t: 0 });
            armDown[side] = 12;
          }
          // finais
          if (fin && !boom) {
            boom = true;
            fx.push({ k: ['erupt', 'smash', 'nova'][i], t: 0 });
          }
          fx = fx.filter((f) => {
            f.t++;
            if (f.k === 'geyser') {
              const T = 18,
                q = f.t < 4 ? f.t / 4 : 1 - (f.t - 4) / (T - 4);
              if (f.t === 3) hit(f.m, Math.floor(rnd(180, 280)));
              flame(ctx, f.m.x + rnd(-2, 2), f.m.y + 12, 90 * q, 14, 1);
              if (f.t < 6) {
                ctx.save();
                ctx.translate(f.m.x, f.m.y + 10);
                ctx.scale(1, 0.4);
                ctx.strokeStyle = `rgba(255,190,80,${1 - f.t / 6})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 10 + f.t * 5, 0, 7);
                ctx.stroke();
                ctx.restore();
              }
              return f.t < T;
            }
            if (f.k === 'fist') {
              const T = 7,
                q = Math.min(1, f.t / T);
              if (f.t <= T) fist(ctx, f.m.x, f.m.y - 160 * (1 - q) + 4, 0.75, 1, 1 - q * 0.5);
              else fist(ctx, f.m.x, f.m.y + 4, 0.75, Math.max(0, 1 - (f.t - T) / 8));
              if (f.t === T) {
                hit(f.m, Math.floor(rnd(190, 290)));
                parts.push({ ring: 1, x: f.m.x, y: f.m.y + 10, t: 0 });
                for (let k = 0; k < 5; k++)
                  rocks.push({ x: f.m.x, y: f.m.y, vx: rnd(-3, 3), vy: rnd(-6, -3), t: 0, s: rnd(3, 6) });
              }
              return f.t < T + 8;
            }
            if (f.k === 'pulse') {
              const r = f.t * 7;
              ctx.save();
              ctx.translate(CX, CY);
              ctx.scale(1.25, 0.6);
              ctx.strokeStyle = `rgba(255,150,40,${Math.max(0, 1 - r / 150)})`;
              ctx.shadowColor = '#ff5a10';
              ctx.shadowBlur = 18;
              ctx.lineWidth = 10;
              ctx.beginPath();
              ctx.arc(0, 0, r, 0, 7);
              ctx.stroke();
              ctx.restore();
              M.forEach((m) => {
                const d = Math.hypot((m.x - CX) / 1.25, (m.y - CY) / 0.6);
                if (Math.abs(d - r) < 7 && m.hit < 0.1) hit(m, Math.floor(rnd(140, 210)));
              });
              return r < 150;
            }
            if (f.k === 'erupt' || f.k === 'smash' || f.k === 'nova') {
              if (f.t === 1) {
                M.forEach((m) => {
                  hit(m, Math.floor(rnd(560, 760)), true);
                  m.stun = 1;
                });
              }
              if (f.t < 8) {
                ctx.fillStyle = `rgba(255,220,150,${0.75 * (1 - f.t / 8)})`;
                ctx.fillRect(-20, -20, W + 40, H + 40);
              }
              if (f.k === 'erupt' && f.t < 34) {
                const a = 1 - f.t / 34;
                flame(ctx, CX, CY + 10, 300 * Math.min(1, f.t / 5), 50, a);
                for (let k = 0; k < 2; k++)
                  rocks.push({ x: CX + rnd(-20, 20), y: CY - 20, vx: rnd(-6, 6), vy: rnd(-9, -4), t: 0, s: rnd(4, 8) });
              }
              if (f.k === 'smash' && f.t < 18) {
                fist(ctx, CX - 40, CY + 10 - 120 * Math.max(0, 1 - f.t / 3), 1.3, 1 - f.t / 18, f.t < 3 ? 1 : 0);
                fist(ctx, CX + 40, CY + 10 - 120 * Math.max(0, 1 - f.t / 3), 1.3, 1 - f.t / 18, f.t < 3 ? 1 : 0);
              }
              if (f.k === 'nova' && f.t < 26) {
                const r = 20 + f.t * 9;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const gr = ctx.createRadialGradient(CX, CY - 30, 0, CX, CY - 30, r);
                gr.addColorStop(0, `rgba(255,240,180,${1 - f.t / 26})`);
                gr.addColorStop(0.5, `rgba(255,130,30,${0.8 * (1 - f.t / 26)})`);
                gr.addColorStop(1, 'rgba(255,50,10,0)');
                ctx.fillStyle = gr;
                ctx.beginPath();
                ctx.arc(CX, CY - 30, r, 0, 7);
                ctx.fill();
                ctx.restore();
                M.forEach((m) => (m.push = Math.min(1, f.t / 10)));
              }
              // onda de choque
              const k = f.t / 40;
              ctx.save();
              ctx.translate(CX, CY);
              ctx.scale(1.25, 0.6);
              ctx.strokeStyle = `rgba(255,170,60,${Math.max(0, 1 - k)})`;
              ctx.shadowColor = '#ff4a10';
              ctx.shadowBlur = 30;
              ctx.lineWidth = 14 * Math.max(0, 1 - k);
              ctx.beginPath();
              ctx.arc(0, 0, 20 + k * 230, 0, 7);
              ctx.stroke();
              ctx.restore();
              if (f.t > 40) M.forEach((m) => (m.stun = Math.max(0, m.stun - 0.03)));
              return f.t < 75;
            }
            return false;
          });
          // pedras
          rocks = rocks.filter((r) => {
            r.t++;
            r.x += r.vx;
            r.y += r.vy;
            r.vy += 0.4;
            ctx.fillStyle = '#5a3a2a';
            ctx.fillRect(r.x, r.y - 10, r.s, r.s);
            ctx.fillStyle = 'rgba(255,120,30,.8)';
            ctx.fillRect(r.x + 1, r.y - 9, r.s / 2, r.s / 2);
            return r.t < 30;
          });
          // fagulhas
          parts = parts.filter((q) => {
            q.t++;
            if (q.ring) {
              ctx.save();
              ctx.translate(q.x, q.y);
              ctx.scale(1, 0.4);
              ctx.strokeStyle = `rgba(255,180,70,${1 - q.t / 16})`;
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.arc(0, 0, q.t * 3.5, 0, 7);
              ctx.stroke();
              ctx.restore();
              return q.t < 16;
            }
            q.x += q.vx;
            q.y += q.vy;
            q.vy += 0.2;
            ctx.fillStyle = `rgba(255,${150 + Math.floor(Math.random() * 90)},60,${1 - q.t / 24})`;
            ctx.fillRect(q.x, q.y, 3, 3);
            return q.t < 24;
          });
          if (act && Math.random() < 0.6)
            parts.push({ x: CX + rnd(-140, 140), y: CY + rnd(-20, 60), vx: rnd(-0.5, 0.5), vy: rnd(-2.5, -1), t: 0 });
          // números
          nums = nums.filter((n) => {
            n.t++;
            ctx.font = `bold ${n.big ? 20 : 14}px system-ui`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000';
            ctx.fillStyle = n.big ? '#fff0c0' : '#ffb060';
            ctx.globalAlpha = Math.min(1, 2 - n.t / 25);
            ctx.strokeText(n.v, n.x, n.y - n.t * 0.8);
            ctx.fillText(n.v, n.x, n.y - n.t * 0.8);
            ctx.globalAlpha = 1;
            return n.t < 50;
          });
          ctx.restore();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      for (let i = 0; i < 3; i++) make(i);
    </script>
  </body>
</html>
