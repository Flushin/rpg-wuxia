<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ultimate em Arco</title>
    <style>
      :root {
        --bg: #0b0f1a;
        --panel: #141a2b;
        --gold: #d4a017;
        --jade: #3fc79a;
        --red: #d8434a;
        --txt: #e8e2cf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 10px;
        opacity: 0.8;
        font-size: 14px;
      }
      .ctl {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 8px 0;
        z-index: 9;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ctl button {
        background: var(--panel);
        color: var(--txt);
        border: 1px solid #d4a01766;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
      }
      .ctl button.on {
        background: var(--gold);
        color: #111;
      }
      .row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .dev {
        position: relative;
        background: linear-gradient(160deg, #2a3a2e, #1b2433 60%, #2b2238);
        border: 6px solid #000;
        border-radius: 22px;
        overflow: hidden;
        flex: none;
      }
      .dev .cap {
        position: absolute;
        left: 8px;
        top: 6px;
        font-size: 11px;
        opacity: 0.7;
      }
      .p {
        width: 230px;
        height: 470px;
      }
      .l {
        width: 470px;
        height: 230px;
      }
      .f {
        width: 400px;
        height: 360px;
      }
      .f::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #ffffff18;
      }
      .cl {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 190px;
        height: 190px;
      }
      .atk {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(#5a2a2a, #2a1414);
        border: 3px solid var(--red);
        display: grid;
        place-items: center;
        font-size: 24px;
      }
      .sk {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #1d2438;
        border: 2px solid #8a93b8;
        display: grid;
        place-items: center;
        font-size: 16px;
      }
      .s1 {
        right: 92px;
        bottom: 6px;
      }
      .s2 {
        right: 84px;
        bottom: 54px;
      }
      .s3 {
        right: 50px;
        bottom: 88px;
      }
      .s4 {
        right: 4px;
        bottom: 96px;
      }
      .arc {
        position: absolute;
        inset: 0;
        width: 190px;
        height: 190px;
        overflow: visible;
        pointer-events: none;
      }
      .arc path {
        fill: none;
        stroke-linecap: round;
      }
      .arc .brd {
        stroke: #8a93b8;
        stroke-width: 40;
      }
      .arc .trk {
        stroke: #1d2438;
        stroke-width: 36;
        pointer-events: stroke;
        cursor: pointer;
      }
      .arc .fil {
        stroke: url(#jd);
        stroke-width: 30;
        stroke-dasharray: 100;
        transition: stroke-dashoffset 0.6s;
        pointer-events: none;
      }
      .arc text {
        font-size: 10px;
        letter-spacing: 2px;
        fill: #e8e2cf;
        opacity: 0.55;
        pointer-events: none;
      }
      .full .arc .brd {
        stroke: var(--gold);
        filter: drop-shadow(0 0 8px #ffd56a);
        animation: pulse 1.1s infinite alternate;
      }
      .full .arc .fil {
        stroke: url(#gd);
      }
      .full .arc text {
        fill: #2a1a00;
        opacity: 1;
        font-weight: 700;
      }
      .boom .arc .brd {
        stroke: #fff;
        filter: drop-shadow(0 0 18px #fff);
      }
      @keyframes pulse {
        from {
          opacity: 0.75;
        }
        to {
          opacity: 1;
        }
      }
      .hint {
        position: absolute;
        left: 10px;
        bottom: 10px;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.3s;
        color: #ffd56a;
      }
      .boom .hint {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0">
      <defs>
        <linearGradient id="jd" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#1f6b55" />
          <stop offset="1" stop-color="#3fc79a" />
        </linearGradient>
        <linearGradient id="gd" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#b8860b" />
          <stop offset=".5" stop-color="#ffd56a" />
          <stop offset="1" stop-color="#b8860b" />
        </linearGradient>
      </defs>
    </svg>
    <h1>Ultimate em arco: prévia 2</h1>
    <p>
      O arco agora tem a mesma grossura dos botões de skill e fica colado nas skills. O botão é o próprio arco. Quando
      ele estiver cheio, toque nele.
    </p>
    <div class="ctl">
      <button data-p=".15" class="on">15%</button><button data-p=".4">40%</button><button data-p=".8">80%</button
      ><button data-p="1">Cheia ✦</button>
    </div>
    <div class="row" id="out"></div>
    <script>
      const D = 'M37 147 A110 110 0 0 1 147 37';
      const devs = [
        ['p', 'Em pé'],
        ['l', 'Deitado'],
        ['f', 'Fold aberto'],
      ];
      let pct = 0.15;
      function draw() {
        document.body.classList.toggle('full', pct >= 1);
        out.innerHTML = devs
          .map(
            (
              [c, n],
              i,
            ) => `<div class="dev ${c}"><span class="cap">${n}</span><span class="hint">終 Ultimate usada!</span><div class="cl">
 <svg class="arc" viewBox="0 0 190 190"><path id="ap${i}" class="brd" d="${D}"/><path class="trk" d="${D}"/><path class="fil" pathLength="100" d="${D}" style="stroke-dashoffset:${100 - pct * 100}"/>
 <text dy="3.5"><textPath href="#ap${i}" startOffset="50%" text-anchor="middle">終 ULTIMATE</textPath></text></svg>
 <div class="atk">⚔</div><div class="sk s1">🔥</div><div class="sk s2">❄</div><div class="sk s3">⚡</div><div class="sk s4">🌀</div></div></div>`,
          )
          .join('');
        out.querySelectorAll('.trk').forEach(
          (t) =>
            (t.onclick = () => {
              if (pct < 1) return;
              const d = t.closest('.dev');
              d.classList.add('boom');
              setTimeout(() => {
                d.classList.remove('boom');
                pct = 0;
                sel(null);
                draw();
              }, 700);
            }),
        );
      }
      function sel(b) {
        document.querySelectorAll('.ctl button').forEach((x) => x.classList.toggle('on', x === b));
      }
      document.querySelectorAll('.ctl button').forEach(
        (b) =>
          (b.onclick = () => {
            pct = +b.dataset.p;
            sel(b);
            draw();
          }),
      );
      draw();
    </script>
  </body>
</html>
