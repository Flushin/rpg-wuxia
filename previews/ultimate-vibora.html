<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ultimate da Víbora</title>
    <style>
      :root {
        --bg: #0b140e;
        --panel: #142219;
        --acc: #8ae05a;
        --txt: #e4f2e0;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: system-ui, sans-serif;
        padding-block: 16px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 4px;
        color: var(--acc);
      }
      p {
        margin: 0 0 10px;
        opacity: 0.85;
        font-size: 14px;
        max-width: 820px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .card {
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
        width: min(100%, 720px);
      }
      canvas {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 4/3;
        border-radius: 8px;
        display: block;
        background: #1a2a1e;
      }
      .card button {
        margin-top: 8px;
        background: var(--acc);
        color: #0c2408;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 15px;
        font-weight: 700;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Ultimate da Víbora: A, B e a junção A + C</h1>
    <p>
      Assassinas da Agulha Esmeralda: agulhas finas de esmeralda (com buraco e linha, nada de flecha), veneno e jade. Os
      monstros atingidos ficam verdes e perdem vida aos poucos depois (números verdes pequenos).
    </p>

                y = CY - 50 + Math.sin(f.an) * f.r * 0.7;
              needle(ctx, x, y, f.an + 0.5, 16, Math.max(0, 1 - f.r / 240));
              return f.r < 240;
            }
            if (f.k === 'tn') {
              const T = 7,
                q = Math.min(1, f.t / T),
                x = CX + (f.m.x + f.dx - CX) * q,
                y = CY - 70 + (f.m.y + f.dy - CY + 70) * q - Math.sin(q * Math.PI) * 30,
                ang = Math.atan2(f.m.y - CY + 70, f.m.x - CX);
              ctx.strokeStyle = 'rgba(80,240,170,.6)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(CX, CY - 70);
              ctx.lineTo(x, y);
              ctx.stroke();
              needle(ctx, x, y, ang, 18);
              if (f.t === T) {
                hit(f.m, Math.floor(rnd(150, 230)));
                threads.push({ m: f.m, dx: f.dx, dy: f.dy, ang });
              }
              return f.t < T;
            }
            if (f.k === 'shade') {
              const T = 9,
                q = Math.min(1, f.t / T),
                tx = f.m.x + f.side * 18,
                ty = f.m.y - 6,
                x = f.from.x + (tx - f.from.x) * q,
                y = f.from.y + (ty - f.from.y) * q - Math.sin(q * Math.PI) * 40;
              // rastro
              ctx.strokeStyle = `rgba(60,240,160,${Math.max(0, 0.4 - f.t / 40)})`;
              ctx.lineWidth = 6;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(f.from.x, f.from.y - 20);
              ctx.quadraticCurveTo((f.from.x + tx) / 2, Math.min(f.from.y, ty) - 60, x, y - 20);
              ctx.stroke();
              const a = f.t < T + 10 ? 0.85 : Math.max(0, 0.85 - (f.t - T - 10) / 10);
              if (ghost) {
                ctx.save();
                ctx.globalAlpha = a;
                ctx.translate(x, y);
                ctx.scale(-f.side * 0.85, 0.85);
                ctx.drawImage(ghost, 3 * 120, 0, 120, 140, -48, -100, 96, 112);
                ctx.restore();
              }
              if (f.t > T && f.t < T + 6) needle(ctx, f.m.x + f.side * 6, f.m.y - 10, f.side > 0 ? Math.PI : 0, 18);
              if (f.t === T) {
                hit(f.m, Math.floor(rnd(180, 260)));
                shades.push({ m: f.m });
                parts.push({ ring: 1, x: f.m.x, y: f.m.y + 8, t: 0 });
              }
              return f.t < T + 20;
            }
            if (f.k === 'stream') {
              if (f.t < 0) return true;
              const T = 8,
                q = Math.min(1, f.t / T),
                x = f.x0 + (f.m.x - f.x0) * q,
                y = f.y0 + (f.m.y - 8 - f.y0) * q - Math.sin(q * Math.PI) * 25;
              if (f.lead) {
                ctx.strokeStyle = 'rgba(80,240,170,.6)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(CX, CY - 70);
                ctx.lineTo(x, y);
                ctx.stroke();
              }
              needle(ctx, x, y, Math.atan2(f.m.y - 8 - f.y0, f.m.x - f.x0), 16);
              if (Math.floor(f.t) === T) {
                hit(f.m, Math.floor(rnd(40, 60)));
                if (f.lead)
                  threads.push({ m: f.m, dx: f.dx, dy: f.dy, ang: Math.atan2(f.m.y - 8 - f.y0, f.m.x - f.x0) });
              }
              return f.t < T;
            }
            if (f.k === 'end') {
              if (f.t === 1 && i !== 2) {
                M.forEach((m) => {
                  hit(m, Math.floor(rnd(540, 720)), true);
                  m.dot = 1;
                });
              }
              if (i === 1 && f.t < 16) {
                // todas as sombras juntas
                M.forEach((m, k) => {
                  if (!ghost) return;
                  const sd = k % 2 ? 1 : -1;
                  ctx.save();
                  ctx.globalAlpha = 0.85 * (1 - f.t / 16);
                  ctx.translate(m.x + sd * 18, m.y - 6);
                  ctx.scale(-sd * 0.85, 0.85);
                  ctx.drawImage(ghost, 3 * 120, 0, 120, 140, -48, -100, 96, 112);
                  ctx.restore();
                });
              }
              if (i === 2) {
                // víbora de agulhas: forma no alto e dá o bote no centro
                const k = Math.min(1, f.t / 14),
                  strike = f.t > 14 ? Math.min(1, (f.t - 14) / 5) : 0;
                const hx = CX + 60 - strike * 60,
                  hy = CY - 150 + strike * 140;
                for (let s = 0; s < 40; s++) {
                  const u = s / 40,
                    x = CX - 90 + u * 150 + Math.sin(u * 9 + f.t * 0.2) * 22 * (1 - u),
                    y = CY - 60 - u * 90 + Math.cos(u * 6) * 15,
                    px = x + (hx - x) * Math.pow(u, 3) * strike,
                    py = y + (hy - y) * Math.pow(u, 3) * strike;
                  const wd = 4 + u * 12;
                  for (let n = 0; n < 3; n++)
                    needle(
                      ctx,
                      px + rnd(-wd, wd) * 0.6,
                      py + rnd(-wd, wd),
                      u * 2 + n * 0.6,
                      13,
                      k * (f.t < 26 ? 1 : Math.max(0, 1 - (f.t - 26) / 10)),
                    );
                }
                if (f.t < 20) {
                  // cabeça de víbora feita de agulhas (capelo aberto)
                  for (let n = 0; n < 22; n++) {
                    const an = (n / 22) * Math.PI * 2;
                    needle(ctx, hx + Math.cos(an) * 20, hy + Math.sin(an) * 12, an, 12, k);
                  }
                  ctx.fillStyle = `rgba(230,255,120,${k})`;
                  ctx.beginPath();
                  ctx.arc(hx - 6, hy - 4, 3, 0, 7);
                  ctx.arc(hx + 6, hy - 4, 3, 0, 7);
                  ctx.fill();
                }
                if (f.t === 19) {
                  M.forEach((m) => {
                    hit(m, Math.floor(rnd(540, 720)), true);
                    m.dot = 1;
                  });
                }
                if (f.t >= 19) cloud(ctx, CX, CY - 10, 40 + (f.t - 19) * 5, Math.max(0, 0.9 - (f.t - 19) / 40));
              }
              const flashT = i === 2 ? f.t - 19 : f.t;
              if (flashT >= 0 && flashT < 8) {
                ctx.fillStyle = `rgba(200,255,225,${0.5 * (1 - flashT / 8)})`;
                ctx.fillRect(-20, -20, W + 40, H + 40);
              }
              if (flashT >= 0)
                M.forEach((m) =>
                  cloud(ctx, m.x, m.y - 6, 22 + Math.min(1, flashT / 8) * 14, Math.max(0, 0.8 - flashT / 50)),
                );
              return f.t < 70;
            }
            return false;
          });
          parts = parts.filter((q) => {
            q.t++;
            if (q.ring) {
              ctx.save();
              ctx.translate(q.x, q.y);
              ctx.scale(1, 0.4);
              ctx.strokeStyle = `rgba(80,240,170,${1 - q.t / 16})`;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(0, 0, q.t * 3.2, 0, 7);
              ctx.stroke();
              ctx.restore();
              return q.t < 16;
            }
            if (q.bub) {
              q.y -= 0.6;
              ctx.strokeStyle = `rgba(150,255,200,${1 - q.t / 30})`;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.arc(q.x, q.y, 2.5, 0, 7);
              ctx.stroke();
              return q.t < 30;
            }
            q.x += q.vx;
            q.y += q.vy;
            q.vy += 0.2;
            ctx.fillStyle = `rgba(90,240,160,${1 - q.t / 22})`;
            ctx.fillRect(q.x, q.y, 3, 3);
            return q.t < 22;
          });
          nums = nums.filter((n) => {
            n.t++;
            ctx.font = `bold ${n.big ? 20 : n.small ? 11 : 14}px system-ui`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000';
            ctx.fillStyle = n.col ?? (n.big ? '#f0fff5' : '#a8f0c8');
            ctx.globalAlpha = Math.min(1, 2 - n.t / 25);
            ctx.strokeText(n.v, n.x, n.y - n.t * 0.8);
            ctx.fillText(n.v, n.x, n.y - n.t * 0.8);
            ctx.globalAlpha = 1;
            return n.t < 50;
          });
          ctx.restore();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      for (let i = 0; i < 3; i++) make(i);
    </script>
  </body>
</html>
