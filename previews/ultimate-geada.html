<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ultimate Geada</title>
    <style>
      :root {
        --bg: #0b0f1a;
        --panel: #141a2b;
        --gold: #9fdcff;
        --txt: #e8eef7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 4px;
        color: var(--gold);
      }
      p {
        margin: 0 0 10px;
        opacity: 0.85;
        font-size: 14px;
        max-width: 820px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .card {
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
        width: min(100%, 720px);
      }
      canvas {
        width: 100%;
        aspect-ratio: 4/3;
        border-radius: 8px;
        display: block;
        background: #1a2a1e;
      }
      .card button {
        margin-top: 8px;
        background: var(--gold);
        color: #0b1626;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 15px;
        font-weight: 700;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Ultimate da Geada: 3 ideias</h1>
    <p>
      Pavilhão da Geada, gelo, dano espiritual, raio grande. Cores: miolo branco, corpo azul-gelo, brilho ciano/lilás.
      Os monstros atingidos ficam azulados (lentidão) e, no fim, congelam.
    </p>

                ctx.quadraticCurveTo(R * 0.5, w, 0, 0);
                ctx.fill();
                ctx.strokeStyle = `rgba(235,248,255,${0.5 + pul * 0.4})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
              }
            }
            ctx.restore();
          }
          // B: redemoinho de neve
          if (i === 1 && (act || (fin && fp < 0.3))) {
            const a = act ? Math.min(1, p * 4) : 1 - fp / 0.3;
            ctx.save();
            ctx.translate(CX, CY - 30);
            for (let k = 0; k < 60; k++) {
              const an = t / 260 + k * 0.7,
                r = 30 + ((k * 37) % 150);
              const x = Math.cos(an) * r * 1.25,
                y = Math.sin(an) * r * 0.55 + 20 - ((k * 13) % 50);
              ctx.fillStyle = `rgba(235,248,255,${0.75 * a})`;
              ctx.beginPath();
              ctx.arc(x, y, 1.2 + (k % 3), 0, 7);
              ctx.fill();
            }
            ctx.strokeStyle = `rgba(190,230,255,${0.45 * a})`;
            ctx.lineWidth = 3;
            for (let k = 0; k < 4; k++) {
              ctx.beginPath();
              ctx.ellipse(0, 20 - k * 12, 60 + k * 30, 22 + k * 8, 0, t / 200 + k, t / 200 + k + 2.2);
              ctx.stroke();
            }
            ctx.restore();
          }
          // monstros
          M.forEach((m) => {
            ctx.fillStyle = '#0005';
            ctx.beginPath();
            ctx.ellipse(m.x, m.y + 12, 16, 5, 0, 0, 7);
            ctx.fill();
            ctx.fillStyle = m.hit > 0 ? '#fff' : m.c;
            ctx.beginPath();
            ctx.ellipse(m.x, m.y - 4, 14, 16, 0, 0, 7);
            ctx.fill();
            if (m.frost > 0) {
              ctx.fillStyle = `rgba(150,210,255,${0.55 * m.frost})`;
              ctx.beginPath();
              ctx.ellipse(m.x, m.y - 4, 14, 16, 0, 0, 7);
              ctx.fill();
            }
            ctx.fillStyle = '#000';
            ctx.fillRect(m.x - 6, m.y - 8, 3, 3);
            ctx.fillRect(m.x + 3, m.y - 8, 3, 3);
            if (m.frozen > 0) {
              ctx.save();
              ctx.globalAlpha = m.frozen;
              ctx.shadowColor = '#9fe6ff';
              ctx.shadowBlur = 14;
              ctx.fillStyle = 'rgba(180,225,255,.55)';
              ctx.strokeStyle = 'rgba(255,255,255,.9)';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(m.x - 20, m.y + 14);
              ctx.lineTo(m.x - 22, m.y - 18);
              ctx.lineTo(m.x - 8, m.y - 30);
              ctx.lineTo(m.x + 12, m.y - 28);
              ctx.lineTo(m.x + 22, m.y - 12);
              ctx.lineTo(m.x + 19, m.y + 14);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(m.x - 10, m.y - 22);
              ctx.lineTo(m.x - 4, m.y + 4);
              ctx.stroke();
              ctx.restore();
            }
            m.hit = Math.max(0, m.hit - 0.12);
          });
          // personagem
          const fi = Math.floor(t / 110) % 8;
          if (spr.complete) {
            ctx.save();
            if (act || t < PRE) {
              ctx.shadowColor = '#9fe6ff';
              ctx.shadowBlur = 25;
            }
            const lev = act ? Math.min(1, p * 5) * 10 + Math.sin(t / 200) * 2 : 0;
            ctx.drawImage(spr, fi * 120, 0, 120, 140, CX - 48, CY - 110 - lev, 96, 112);
            ctx.restore();
          }
          if (act) {
            const gl = ctx.createRadialGradient(CX, CY - 95, 0, CX, CY - 95, 34 + Math.random() * 8);
            gl.addColorStop(0, 'rgba(255,255,255,.95)');
            gl.addColorStop(0.3, 'rgba(160,220,255,.75)');
            gl.addColorStop(0.7, 'rgba(185,166,255,.35)');
            gl.addColorStop(1, 'rgba(185,166,255,0)');
            ctx.fillStyle = gl;
            ctx.beginPath();
            ctx.arc(CX, CY - 95, 42, 0, 7);
            ctx.fill();
          }
          // A: nevasca + lanças do céu
          if (i === 0 && (act || fin)) {
            const a = act ? Math.min(1, p * 4) : Math.max(0, 1 - fp * 1.5);
            snow.forEach((s) => {
              s.x -= s.v * 2.2;
              s.y += s.v * 2.6;
              if (s.y > H) s.y = -5;
              if (s.x < 0) s.x = W;
              ctx.fillStyle = `rgba(240,250,255,${0.8 * a})`;
              ctx.fillRect(s.x, s.y, s.s, s.s);
              ctx.strokeStyle = `rgba(240,250,255,${0.25 * a})`;
              ctx.beginPath();
              ctx.moveTo(s.x, s.y);
              ctx.lineTo(s.x + 6, s.y - 7);
              ctx.stroke();
            });
            if (act && newTick) {
              const m = M[Math.floor(Math.random() * M.length)];
              fx.push({ k: 'spear', m, t: 0, x0: m.x + rnd(40, 90) });
              if (Math.random() < 0.5) {
                const m2 = M[Math.floor(Math.random() * M.length)];
                fx.push({ k: 'spear', m: m2, t: 0, x0: m2.x + rnd(40, 90) });
              }
            }
            if (fin && !boom) ((boom = true), fx.push({ k: 'comet', t: 0 }));
          }
          // B: ondas de lâminas em espiral
          if (i === 1 && act) {
            if (newTick && tick % 2 === 0) {
              const base = t / 300;
              for (let k = 0; k < 8; k++) fx.push({ k: 'blade', an: base + (k / 8) * Math.PI * 2, r: 10, t: 0 });
            }
          }
          // C: espinhos em ondas
          if (i === 2 && act && newTick && tick % 2 === 0) {
            const wave = M.filter(() => Math.random() < 0.45);
            wave.forEach((m) => fx.push({ k: 'spike', m, t: 0 }));
            if (!wave.length) fx.push({ k: 'spike', m: M[0], t: 0 });
          }
          // final B e C: congelar
          if ((i === 1 || i === 2) && fin) {
            M.forEach((m) => (m.frozen = fp < 0.55 ? Math.min(1, fp * 5) : Math.max(0, 1 - (fp - 0.55) * 6)));
            if (i === 1 && fp > 0.55 && !boom) {
              boom = true;
              fx.push({ k: 'burst', t: 0 });
              M.forEach((m) => {
                hit(m, Math.floor(rnd(520, 720)), true);
                for (let k = 0; k < 10; k++)
                  parts.push({ x: m.x, y: m.y - 10, vx: rnd(-5, 5), vy: rnd(-6, 1), t: 0, ice: 2 });
              });
            }
          }
          if (i === 2 && fin) {
            if (!cracks) {
              cracks = [];
              for (let k = 0; k < 14; k++) {
                let x = CX,
                  y = CY - 40,
                  an = (k / 14) * Math.PI * 2 + rnd(-0.2, 0.2);
                const P = [[x, y]];
                for (let s = 0; s < 6; s++) {
                  an += rnd(-0.4, 0.4);
                  x += Math.cos(an) * rnd(30, 60);
                  y += Math.sin(an) * rnd(30, 60);
                  P.push([x, y]);
                }
                cracks.push(P);
              }
            }
            if (fp < 0.55) {
              const a = Math.min(1, fp * 4);
              ctx.fillStyle = `rgba(200,235,255,${0.35 * a})`;
              ctx.fillRect(-20, -20, W + 40, H + 40);
              ctx.strokeStyle = `rgba(255,255,255,${0.9 * a})`;
              ctx.lineWidth = 1.5;
              ctx.shadowColor = '#bfe8ff';
              ctx.shadowBlur = 8;
              const n = Math.floor(Math.min(1, fp * 3) * 6) + 1;
              cracks.forEach((P) => {
                ctx.beginPath();
                ctx.moveTo(...P[0]);
                P.slice(1, n + 1).forEach((q) => ctx.lineTo(...q));
                ctx.stroke();
              });
              ctx.shadowBlur = 0;
            } else if (!boom) {
              boom = true;
              fx.push({ k: 'glass', t: 0 });
              M.forEach((m) => hit(m, Math.floor(rnd(520, 720)), true));
              for (let k = 0; k < 40; k++)
                parts.push({
                  x: rnd(0, W),
                  y: rnd(0, H),
                  vx: rnd(-3, 3),
                  vy: rnd(-3, 2),
                  t: 0,
                  ice: 3,
                  rot: rnd(0, 6),
                });
            }
          }
          // desenhar fx
          fx = fx.filter((f) => {
            f.t++;
            if (f.k === 'spear') {
              const T = 7,
                q = Math.min(1, f.t / T);
              const x = f.x0 + (f.m.x - f.x0) * q,
                y = -30 + (f.m.y - 10 + 30) * q;
              if (f.t <= T) shard(ctx, x, y, Math.atan2(f.m.y + 30, f.m.x - f.x0), 46, 7);
              if (f.t === T) {
                hit(f.m, Math.floor(rnd(170, 260)));
                parts.push({ ring: 1, x: f.m.x, y: f.m.y + 8, t: 0 });
                ctx.fillStyle = 'rgba(210,240,255,.18)';
                ctx.fillRect(0, 0, W, H);
              }
              if (f.t > T && f.t < T + 14) crystal(ctx, f.m.x + 6, f.m.y + 10, 22, 1 - (f.t - T) / 14);
              return f.t < T + 14;
            }
            if (f.k === 'comet') {
              const T = 14,
                q = Math.min(1, f.t / T);
              if (f.t <= T) {
                const x = CX + 220 * (1 - q),
                  y = -60 + (CY + 60) * q;
                ctx.save();
                ctx.shadowColor = '#9fe6ff';
                ctx.shadowBlur = 40;
                for (let s = 0; s < 10; s++) {
                  ctx.fillStyle = `rgba(180,225,255,${0.5 - s * 0.045})`;
                  ctx.beginPath();
                  ctx.arc(x + s * 14, y - s * 16, 26 - s * 2, 0, 7);
                  ctx.fill();
                }
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x, y, 18, 0, 7);
                ctx.fill();
                ctx.restore();
              }
              if (f.t === T) {
                M.forEach((m) => {
                  hit(m, Math.floor(rnd(520, 720)), true);
                  m.frozen = 1;
                });
              }
              if (f.t > T) {
                const k = (f.t - T) / 40;
                ctx.save();
                ctx.translate(CX, CY);
                ctx.scale(1.25, 0.6);
                ctx.strokeStyle = `rgba(230,248,255,${1 - k})`;
                ctx.lineWidth = 14 * (1 - k);
                ctx.shadowColor = '#9fe6ff';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(0, 0, 20 + k * 260, 0, 7);
                ctx.stroke();
                ctx.restore();
                if (f.t < T + 6) {
                  ctx.fillStyle = `rgba(235,248,255,${0.8 * (1 - (f.t - T) / 6)})`;
                  ctx.fillRect(-20, -20, W + 40, H + 40);
                }
                M.forEach((m) => (m.frozen = Math.max(0, 1 - Math.max(0, k - 0.6) * 3)));
              }
              return f.t < T + 40;
            }
            if (f.k === 'blade') {
              f.r += 7;
              f.an += 0.06;
              const x = CX + Math.cos(f.an) * f.r * 1.25,
                y = CY - 30 + Math.sin(f.an) * f.r * 0.7;
              shard(ctx, x, y, f.an + Math.PI / 2 + 0.6, 26, 5, Math.max(0, 1 - f.r / 260));
              M.forEach((m) => {
                if (Math.hypot(m.x - x, m.y - y) < 22 && m.hit < 0.1) hit(m, Math.floor(rnd(120, 190)));
              });
              return f.r < 260;
            }
            if (f.k === 'spike') {
              const T = 22,
                q = f.t < 5 ? f.t / 5 : 1;
              if (f.t === 4) hit(f.m, Math.floor(rnd(170, 260)));
              crystal(ctx, f.m.x, f.m.y + 14, 46 * q, f.t < 14 ? 1 : 1 - (f.t - 14) / 8);
              return f.t < T;
            }
            if (f.k === 'burst' || f.k === 'glass') {
              if (f.t < 8) {
                ctx.fillStyle = `rgba(235,248,255,${0.75 * (1 - f.t / 8)})`;
                ctx.fillRect(-20, -20, W + 40, H + 40);
              }
              return f.t < 10;
            }
            return false;
          });
          // partículas
          parts = parts.filter((q) => {
            q.t++;
            if (q.ring) {
              ctx.save();
              ctx.translate(q.x, q.y);
              ctx.scale(1, 0.4);
              ctx.strokeStyle = `rgba(200,240,255,${1 - q.t / 16})`;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(0, 0, q.t * 3, 0, 7);
              ctx.stroke();
              ctx.restore();
              return q.t < 16;
            }
            q.x += q.vx;
            q.y += q.vy;
            q.vy += 0.25;
            if (q.ice === 3) {
              ctx.save();
              ctx.translate(q.x, q.y);
              ctx.rotate((q.rot += 0.1));
              ctx.fillStyle = `rgba(220,245,255,${1 - q.t / 40})`;
              ctx.strokeStyle = `rgba(255,255,255,${1 - q.t / 40})`;
              ctx.beginPath();
              ctx.moveTo(0, -14);
              ctx.lineTo(12, 6);
              ctx.lineTo(-8, 10);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
              return q.t < 40;
            }
            ctx.fillStyle = q.ice === 2 ? `rgba(235,248,255,${1 - q.t / 26})` : `rgba(190,230,255,${1 - q.t / 22})`;
            ctx.fillRect(q.x, q.y, q.ice === 2 ? 4 : 3, q.ice === 2 ? 4 : 3);
            return q.t < (q.ice === 2 ? 26 : 22);
          });
          // números
          nums = nums.filter((n) => {
            n.t++;
            ctx.font = `bold ${n.big ? 20 : 14}px system-ui`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000';
            ctx.fillStyle = n.big ? '#ffffff' : '#bfe8ff';
            ctx.globalAlpha = Math.min(1, 2 - n.t / 25);
            ctx.strokeText(n.v, n.x, n.y - n.t * 0.8);
            ctx.fillText(n.v, n.x, n.y - n.t * 0.8);
            ctx.globalAlpha = 1;
            return n.t < 50;
          });
          ctx.restore();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      for (let i = 0; i < 3; i++) make(i);
    </script>
  </body>
</html>
